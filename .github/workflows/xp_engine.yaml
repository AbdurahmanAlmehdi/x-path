# Uses the repo's dart_package workflow (the same test command as
# `melos run test:coverage`). The macOS job enforces the coverage
# threshold; the Linux job runs the same tests without a gate.
name: xp_engine

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/dart_package.yaml"
      - ".github/workflows/xp_engine.yaml"
      - "packages/xp_engine/**"
      - "packages/xp_api/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dart_package.yaml"
      - ".github/workflows/xp_engine.yaml"
      - "packages/xp_engine/**"
      - "packages/xp_api/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"

jobs:
  macos:
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: packages/xp_engine
      runs_on: macos-latest
      min_coverage: 100
      directories: "lib test"

  linux:
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: packages/xp_engine
      runs_on: ubuntu-latest
      min_coverage: 0
      directories: "lib test"
