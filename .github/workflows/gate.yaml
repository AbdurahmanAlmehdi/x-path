# The check branch protection requires: the job `gate` runs the whole Linux
# gate on every pull request and every push to main, with no path filters, so
# it always reports. It runs what CONTRIBUTING.md asks before a push: analyze,
# format, the layer check, every package's tests with its coverage threshold
# (`melos run test:coverage`: 100% for xp_api, xp_client, xp_engine and
# xp_repositories, 90% for the rest), the contract tests and the xpd bundle
# smoke test. Tests tagged `macos` or `golden` run on macOS only (the `macos`
# workflow, on a public repository).
#
# Flutter 3.47.6 ships Dart 3.13.5; keep both in sync with .fvmrc. The
# workspace has Flutter members, so even `dart pub get` needs the Flutter SDK.
# Keep melos at the version of pubspec.lock.
name: gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install melos and very_good_cli
        run: |
          dart pub global activate melos 8.9.0
          dart pub global activate very_good_cli 1.5.0

      - name: Install Dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Check Layers
        run: dart run tool/check_layers.dart

      - name: Test with Coverage
        run: melos run test:coverage

      - name: Contract Tests
        run: melos run test:contract

      - name: Smoke Test the xpd Bundle
        run: tool/e2e/smoke_bundle.sh
