# Fails when a package depends on something its layer may not.
# Flutter 3.47.6 ships Dart 3.13.5; keep both in sync with .fvmrc. The workspace
# has Flutter members, so even `dart pub get` needs the Flutter SDK.
name: layers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/layers.yaml"
      - "apps/**"
      - "packages/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/layers.yaml"
      - "apps/**"
      - "packages/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"

jobs:
  check-layers:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧱 Check Layers
        run: dart run tool/check_layers.dart
