# Runs the repo's dart_package workflow (the same test command as
# `melos run test:coverage`) on Linux with the package's coverage gate.
# No GitHub macOS runners (billed at 10x): `macos`-tagged tests and the
# macOS coverage gate run locally with `melos run test:coverage`.
name: xp_repositories

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/dart_package.yaml"
      - ".github/workflows/xp_repositories.yaml"
      - "packages/xp_repositories/**"
      - "packages/xp_api/**"
      - "packages/xp_client/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dart_package.yaml"
      - ".github/workflows/xp_repositories.yaml"
      - "packages/xp_repositories/**"
      - "packages/xp_api/**"
      - "packages/xp_client/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".fvmrc"

jobs:
  linux:
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: packages/xp_repositories
      runs_on: ubuntu-latest
      min_coverage: 100
      directories: "lib test"
