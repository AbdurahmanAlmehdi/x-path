# Reusable job for the workspace's pure Dart packages. It runs exactly what
# `melos run test:coverage` runs locally (`very_good dart test`), so coverage
# and test tags (`macos`, `integration`) behave the same on CI. The Flutter SDK
# is installed because the workspace has Flutter members, so even `dart pub get`
# needs it. Keep the version in sync with .fvmrc.
name: dart_package

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      min_coverage:
        required: false
        type: number
        default: 100
      directories:
        required: false
        type: string
        default: "lib test"

jobs:
  build:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install very_good_cli
        run: dart pub global activate very_good_cli 1.5.0

      - name: Install dependencies
        run: dart pub get

      - name: Format
        run: dart format --set-exit-if-changed ${{ inputs.directories }}

      - name: Analyze
        run: dart analyze --fatal-infos ${{ inputs.directories }}

      - name: Test
        run: >-
          very_good dart test --no-optimization --coverage
          --min-coverage ${{ inputs.min_coverage }}
          --exclude-coverage '**/*.g.dart' --show-uncovered
