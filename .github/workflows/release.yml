# Releases XPath itself on every merge to main (CONTRIBUTING.md, "Pull
# request titles"), except a merge that only changes the website (site/).
# Nothing is committed to main; the version lives in the tag:
#
#   version   tool/release_version.dart decides it: the tag already on the
#             commit (a run again), else the highest vX.Y.Z tag reachable
#             from it bumped by the Conventional Commits titles of the
#             first-parent commits since (feat or breaking: minor before 1.0;
#             anything else: patch). Without a tag the base is the version of
#             apps/xpd/pubspec.yaml. The build number is the commit count.
#   bundles   writes that version into the pubspecs and packageVersion
#             constants of its checkout only, builds the Linux bundles and
#             archives (tool/release/bundles.sh), runs the smoke test and the
#             install.sh test.
#   arm64     runs the arm64 bundles on an arm64 machine.
#   docker    builds, tests and pushes the image (linux/amd64, linux/arm64).
#   docker-runner
#             builds the xpath-runner image (Dockerfile.runner, linux/amd64:
#             install.sh --runner --with-android), checks that `xp runner
#             doctor` in it finds android and flutter, and pushes it.
#   release   tags the commit vX.Y.Z and creates the GitHub Release with
#             generated notes and the assets (a pre-release before 1.0 or
#             with a "-"); on a run again it replaces the assets.
#   dmg       public repository with the signing secrets only: the Developer
#             ID signed, notarized DMG (tool/release/build_mac.sh) and the
#             macOS archives, uploaded to the same release.
#
# A tag vX.Y.Z pushed by hand (1.0 is tagged by hand) releases that version.
# "Run workflow" on main runs again for its HEAD, with an optional version.
#
# Flutter 3.47.6 ships Dart 3.13.5; keep both in sync with .fvmrc. The
# workspace has Flutter members, so even `dart pub get` needs the Flutter SDK.
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # A push to main that only changes the website publishes no release: Cloudflare deploys site/ by
    # itself. GitHub does not apply path filters to tag pushes, so a tag still releases.
    paths-ignore:
      - "site/**"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release (1.0.0, 1.0.0-rc.1). Empty: the tag already
          on HEAD, else the next version from the commit titles.
        required: false
        type: string

# One release at a time and never cancelled: each run reads the tag the one
# before made. GitHub keeps only the newest waiting run; the version it makes
# still counts the titles of the merges whose run it replaced.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/abdurahmanalmehdi/xpath
  RUNNER_IMAGE: ghcr.io/abdurahmanalmehdi/xpath-runner

jobs:
  version:
    # Releases come from main or from a tag, never from another branch.
    if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      build: ${{ steps.next.outputs.build }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      # The whole history: every tag, and the commit count.
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install Dependencies
        run: dart pub get

      - name: Decide the Version
        id: next
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          args=(next)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          elif [ -n "${INPUT_VERSION}" ]; then
            args+=(--tag "v${INPUT_VERSION#v}")
          fi
          dart run tool/release_version.dart "${args[@]}" >> "$GITHUB_OUTPUT"

  bundles:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install Dependencies
        run: dart pub get

      - name: Write the Version into the Checkout
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: dart run tool/release_version.dart apply "${VERSION}" "${BUILD}"

      # Also checks that the linux-x64 xpd and xp print the version.
      - name: Build the Bundles
        run: tool/release/bundles.sh

      - name: Smoke Test the xpd Bundle
        run: tool/e2e/smoke_bundle.sh

      - name: Test install.sh
        run: tool/release/linux/install_test.sh

      # Artifacts drop the executable bit, so the folder travels as one tar.
      - name: Pack the Build
        run: tar -cf release.tar build/release

      - name: Upload the Build
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar
          retention-days: 7

  arm64:
    needs: [version, bundles]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Download the Build
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack the Build
        run: tar -xf release.tar

      - name: Run the arm64 Bundles
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bundles=build/release/bundles/linux-arm64
          "${bundles}/xpd/bin/xpd" --version
          test "$("${bundles}/xpd/bin/xpd" --version | cut -d' ' -f2)" = "${VERSION}"
          test "$("${bundles}/xp/bin/xp" --version)" = "${VERSION}"

      - name: Test install.sh
        env:
          XPATH_VERSION: ${{ needs.version.outputs.version }}
        run: tool/release/linux/install_test.sh

  docker:
    needs: [version, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Download the Build
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack the Build
        run: tar -xf release.tar

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Image for a Test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xpath:test

      - name: Test the Image
        run: |
          test "$(docker run --rm xpath:test xpd --version | cut -d' ' -f2)" = "${VERSION}"
          docker run -d --name xpath -p 127.0.0.1:7480:7480 xpath:test
          for _ in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' xpath)" = healthy ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' xpath | grep -qx healthy
          test "$(curl -fsS http://127.0.0.1:7480/health)" = '{"status":"ok"}'
          docker stop xpath
          test "$(docker inspect --format '{{.State.ExitCode}}' xpath)" = 0

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release (before 1.0, or with a "-") does not move `latest`.
      - name: Choose the Image Tags
        id: tags
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tags="${IMAGE}:${VERSION}"
          [ "${PRERELEASE}" = true ] || tags="${tags},${IMAGE}:latest"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  docker-runner:
    needs: [version, bundles]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Download the Build
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack the Build
        run: tar -xf release.tar

      - name: Build the Runner Image
        run: docker build -f Dockerfile.runner -t xpath-runner:test .

      # The image is built by install.sh --with-android: a runner made from it
      # must offer android and flutter.
      - name: Test the Runner Image
        run: |
          test "$(docker run --rm xpath-runner:test --version)" = "${VERSION}"
          docker run --rm xpath-runner:test --json runner doctor | tee doctor.json
          jq -e '[.checks[] | select(.state == "ok") | .name] | index("android") and index("flutter")' doctor.json

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: Google ships no Android build tools for Linux arm64. A
      # pre-release does not move `latest`.
      - name: Push the Runner Image
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          docker tag xpath-runner:test "${RUNNER_IMAGE}:${VERSION}"
          docker push "${RUNNER_IMAGE}:${VERSION}"
          if [ "${PRERELEASE}" != true ]; then
            docker tag xpath-runner:test "${RUNNER_IMAGE}:latest"
            docker push "${RUNNER_IMAGE}:latest"
          fi

  release:
    needs: [version, bundles, arm64, docker, docker-runner]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the Build
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack the Build
        run: tar -xf release.tar

      # `gh release create` makes the tag on the commit this run built
      # (through the API: nothing is pushed). A tag pushed by hand is used as
      # it is.
      - name: Tag the Commit and Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "The release ${TAG} exists: replacing its Linux assets."
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
              build/release/assets/*
          else
            flags=(--target "${GITHUB_SHA}" --title "XPath ${VERSION}" --generate-notes)
            [ "${PRERELEASE}" = true ] && flags+=(--prerelease)
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}" \
              build/release/assets/*
          fi

  # GitHub-hosted macOS runners are free only for public repositories. The
  # job skips itself, with a notice, until every signing secret is set (see
  # README, "Releases and installation"). The certificate goes into a
  # keychain of its own that the last step deletes.
  dmg:
    needs: [version, release]
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check the Signing Secrets
        id: secrets
        env:
          P12: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "${P12}" ] && [ -n "${P12_PASSWORD}" ] && [ -n "${NOTARY_KEY}" ] \
            && [ -n "${NOTARY_KEY_ID}" ] && [ -n "${NOTARY_ISSUER_ID}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No DMG for ${TAG}::Set the secrets MAC_DEVELOPER_ID_P12_BASE64, MAC_DEVELOPER_ID_P12_PASSWORD, MAC_NOTARY_KEY_P8_BASE64, MAC_NOTARY_KEY_ID and MAC_NOTARY_ISSUER_ID to build the notarized DMG (README, Releases and installation)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Git Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Setup Flutter
        if: steps.secrets.outputs.ready == 'true'
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install Dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: dart pub get

      - name: Write the Version into the Checkout
        if: steps.secrets.outputs.ready == 'true'
        run: dart run tool/release_version.dart apply "${VERSION}" "${BUILD}"

      - name: Import the Developer ID Certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          P12: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/xpath-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "XPATH_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          (umask 077 && printf '%s' "${P12}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12")
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/developer-id.p12" -k "${keychain}" -f pkcs12 \
            -P "${P12_PASSWORD}" -T /usr/bin/codesign
          rm -f "${RUNNER_TEMP}/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${password}" "${keychain}" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${keychain}" \
            $(security list-keychains -d user | tr -d '"')

      - name: Write the Notary Key
        if: steps.secrets.outputs.ready == 'true'
        env:
          NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
        run: |
          (umask 077 && printf '%s' "${NOTARY_KEY}" | base64 --decode > "${RUNNER_TEMP}/notary.p8")
          echo "XPATH_NOTARY_KEY=${RUNNER_TEMP}/notary.p8" >> "$GITHUB_ENV"

      - name: Build, Notarize and Upload the DMG
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XPATH_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          XPATH_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: tool/release/build_mac.sh --developer-id --dmg --notarize --upload "${TAG}"

      - name: Upload the macOS Archives
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber build/release/assets/*-macos-*

      - name: Delete the Keychain and the Keys
        if: always() && steps.secrets.outputs.ready == 'true'
        run: |
          if [ -n "${XPATH_KEYCHAIN:-}" ]; then
            security delete-keychain "${XPATH_KEYCHAIN}" || true
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/notary.p8"
