# What makes a fresh Linux box a runner, checked on the pull requests that
# change it: install.sh with its tests (including --with-android against fake
# package managers), and later the xpath-runner image. The release workflow
# runs the same checks on every push to main; this one catches them before the
# merge. It builds the linux-x64 bundles only, so it takes a few minutes.
name: runner setup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/runner_setup.yaml"
      - "tool/release/**"
      - "Dockerfile.runner"
      - "apps/xp/lib/src/runner/**"

permissions:
  contents: read

jobs:
  install:
    name: install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install Dependencies
        run: dart pub get

      - name: Build the linux-x64 Bundles
        run: tool/release/bundles.sh --targets linux-x64

      - name: Test install.sh
        run: tool/release/linux/install_test.sh
