# The macOS gate: what the Linux `gate` cannot run, split into jobs that run
# in parallel:
#
#   - coverage: one job per package that has tests only macOS runs or code
#     that depends on the host OS, with the same `test:coverage:*` script
#     (and so the same threshold) as in the `gate` workflow. That covers the
#     `macos`-tagged tests (the Keychain), the desktop goldens (`golden`,
#     drawn on macOS) and the Flutter packages. The other packages run the
#     same tests on Linux, so only `gate` runs them.
#   - build-desktop: a debug build of the desktop app (`flutter build macos`,
#     the Swift side).
#
# The job `macos` waits for both and fails unless all of them passed, so the
# `macos` check keeps its name. `dart run tool/check_ci_matrix.dart` (in
# `gate`) fails when a package with macOS-only tests is missing below.
#
# GitHub-hosted macOS runners are free only for public repositories, so the
# jobs run only when the repository is public. On a private one they are
# skipped, and a skipped job counts as passed for a required check.
#
# Flutter 3.47.6 ships Dart 3.13.5; keep both in sync with .fvmrc. Keep melos
# at the version of pubspec.lock.
name: macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    name: coverage (${{ matrix.package }})
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `script` is the `test:coverage:<script>` that sets the threshold.
        include:
          - { package: xp_engine, script: strict }
          - { package: xp, script: floor }
          - { package: xpd, script: floor }
          - { package: xp_adapters, script: floor }
          - { package: xp_secrets, script: floor }
          - { package: xp_desktop, script: flutter }
          - { package: xp_macos_services, script: flutter }
    steps:
      - &checkout
        name: Git Checkout
        uses: actions/checkout@v7

      - &setup-flutter
        name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.6"
          cache: true

      - name: Install melos and very_good_cli
        run: |
          dart pub global activate melos 8.9.0
          dart pub global activate very_good_cli 1.5.0

      - &install-dependencies
        name: Install Dependencies
        run: dart pub get

      - name: Test with Coverage
        run: >-
          melos run "test:coverage:${{ matrix.script }}" --include-private
          --scope="${{ matrix.package }}"

  build-desktop:
    name: build-desktop
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-flutter
      - *install-dependencies

      - name: Build the Desktop App
        working-directory: apps/xp_desktop
        run: flutter build macos --debug

  macos:
    name: macos
    if: ${{ always() && !github.event.repository.private }}
    needs: [coverage, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Every Job to Pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
