name: Feature request
description: Something XPath should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why XPath gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, in the app, `xp` or a workflow.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
