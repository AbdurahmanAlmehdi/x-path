openapi: 3.1.0
info:
  title: XPath engine API
  version: "1"
  summary: HTTP/JSON plus one WebSocket, served by xpd.
  description: |
    Hand-maintained; it grows phase by phase. Every response in the test
    suite is validated against this file (tests tagged `contract`).

    Every route except `/health` and `/version` needs a device token:
    `Authorization: Bearer <token>`. Errors are always
    `{"error": {"code": "...", "message": "..."}}`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:7480
    description: Default loopback address of a local engine.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: The engine is serving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /version:
    get:
      operationId: getVersion
      summary: Engine and API version, for compatibility checks before pairing.
      security: []
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /events:
    get:
      operationId: streamEvents
      summary: WebSocket stream of engine events.
      description: |
        Upgrade to a WebSocket (browsers are refused: any `Origin` header is
        rejected). Every text frame is one JSON `SequencedEvent`.

        The first frame is always `stream.opened`; its `seq` is the head of
        the event log. With `after=<seq>` the engine then replays every
        logged event with a greater `seq`, in order, and continues with live
        events. Without `after` only live events follow. A client stores the
        `seq` of the last event it handled and reconnects with that value.

        When `after` is older than the retained window, or newer than the
        head (the engine restarted), the response is `409 resync_required`:
        reload state over HTTP and reconnect without `after`. If the window
        is lost after the upgrade, the engine closes the socket with code
        4409 instead.

        On shutdown the engine closes the socket with code 1000 (normal
        closure) and the reason `engine shutting down`.
      parameters:
        - name: after
          in: query
          required: false
          description: Last `seq` the client has seen.
          schema:
            type: integer
            minimum: 0
      responses:
        "101":
          description: Switching Protocols. Frames follow `SequencedEvent`.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ResyncRequired"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects:
    get:
      operationId: listProjects
      summary: Every project, oldest first.
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addProject
      summary: Add a GitHub repository as a project, and scan it.
      description: |
        Give exactly one of `path` and `remote`.

        With `path` (an absolute folder on the engine's machine), the engine
        reads the `origin` of the clone to find the repository, asks GitHub
        for it, sets up its own mirror and scans the folder. The folder only
        identifies the repository and seeds the scan (D-05); nothing is
        written to it (D-04).

        With `remote` (`owner/name` or a GitHub URL), the engine fetches the
        repository into its mirror and scans the default branch there.

        Projects are keyed by the GitHub repository id: a repository that is a
        project already answers `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectRequest"
      responses:
        "201":
          description: The project was added.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: One project, with its profile and the findings of the last scan.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      summary: Edit the profile of a project.
      description: |
        The edits are kept apart from the scan and applied again after every
        scan, so a rescan never undoes them. Fields that are left out keep
        their value; edits merge with earlier ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileEdits"
      responses:
        "200":
          description: The project with the edits applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeProject
      summary: Remove a project.
      description: |
        The engine's mirror stays on disk and the folder the project was added
        from is never touched. A project with releases or jobs cannot be
        removed.
      responses:
        "204":
          description: The project is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/scan:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: scanProject
      summary: Scan a project again.
      description: |
        Scans the folder the project was added from if it still exists, else a
        fresh worktree of the engine's mirror at the default branch. GitHub is
        asked for the repository first, so a rename or a new default branch is
        followed; if GitHub cannot be reached the stored values stay.
      responses:
        "200":
          description: The project with the new scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      summary: One job, with its steps.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelJob
      summary: Cancel a job.
      description: |
        Stops the process tree of the running step: `SIGTERM` to its process
        group, ten seconds of grace, then `SIGKILL` (ADR 0003). The response
        comes once the job has ended, so it can take up to ten seconds. A job
        that is not running (queued, interrupted, waiting for a resume) is
        cancelled at once. A job that has ended answers `409 conflict`.
      responses:
        "200":
          description: The cancelled job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: resumeJob
      summary: Resume a job at its first unfinished step.
      description: |
        Valid for a job that is `failed`, `cancelled`, `interrupted`,
        `waiting_for_resume` or `waiting_for_approval`. A job that is part
        of a run goes back in the queue of the scheduler and takes its turn
        (a production release waits for the project, a job waits for a free
        slot): the answer is the job, `queued` or `running`. Steps that succeeded or were skipped are not run
        again (D-18). A step with side effects that was started before asks
        its store whether the work exists already (`alreadyDone`) and is
        skipped if so; only a resume ever runs it again. The job runs in the
        background: follow `job.state_changed` on `/events` or the log
        WebSocket.

        With `fromStep` the job re-runs from that step even if it and later
        steps succeeded; every earlier step must be done.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeJobRequest"
      responses:
        "202":
          description: The job is running again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: streamJobLogs
      summary: WebSocket stream of a job's log lines.
      description: |
        Upgrade to a WebSocket (browsers are refused, as for `/events`). Every
        text frame is one JSON `LogFrame`. Lines are masked before they are
        stored or sent: known secret values read `***`.

        The engine replays the lines of the job with a `seq` greater than
        `after` (default 0, the whole log), then follows the job live. `seq`
        counts the lines of the whole job from 1, across its steps, and
        survives a resume. A client stores the `seq` of the last line it
        handled and reconnects with that value.

        A frame queue is bounded: a client that falls behind, for example
        while it replays a long log of a job that keeps writing, gets a `gap`
        frame in place of the lines it missed (they are in the log; reconnect
        with `after` to read them). When the job is not running (it ended, or
        is interrupted or waiting for a resume) and everything was sent, the
        last frame is `end`, with the state the job is in, and the engine
        closes the socket with code 1000.

        An `after` greater than the newest line answers `409 resync_required`.
      parameters:
        - name: after
          in: query
          required: false
          description: Last `seq` the client has seen.
          schema:
            type: integer
            minimum: 0
      responses:
        "101":
          description: Switching Protocols. Frames follow `LogFrame`.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResyncRequired"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: listJobArtifacts
      summary: The files a job produced.
      description: |
        The builds (`apk`, `aab`, `ipa`) and the manifest the job stored, oldest
        first. A job that produced nothing answers an empty list.
      responses:
        "200":
          description: The artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getArtifact
      summary: One artifact's metadata.
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: downloadArtifact
      summary: The content of an artifact.
      description: |
        Streams the stored file. `Content-Length` is its size and
        `X-Content-SHA256` its SHA-256 in lowercase hexadecimal, so a client
        can verify what it saved.
      responses:
        "200":
          description: The file.
          headers:
            Content-Length:
              schema:
                type: integer
            X-Content-SHA256:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: pinArtifact
      summary: Keep an artifact when the engine frees up space.
      description: Pinning a pinned artifact changes nothing.
      responses:
        "200":
          description: The artifact, pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/unpin:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: unpinArtifact
      summary: Let the engine remove an artifact when it frees up space.
      description: Unpinning an artifact that is not pinned changes nothing.
      responses:
        "200":
          description: The artifact, not pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/tests:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJobTests
      summary: The test run of a job, with what changed against the baseline.
      description: |
        The `test` step stores one run per job. `diff` says which tests fail
        that did not fail in the baseline (`newFailures`), which were fixed and
        which the baseline had and this run did not report. `tests` is a page
        of the run's tests ordered by file and name; by default only the tests
        that failed or threw.
      parameters:
        - name: status
          in: query
          description: |
            Comma-separated statuses to list. Defaults to `failed,errored`.
          schema:
            type: string
            example: failed,errored
        - name: limit
          in: query
          description: How many tests to list at most. Defaults to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: How many matching tests to skip.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/tests/baseline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectTestBaselines
      summary: The runs that new test runs of a project are compared with.
      description: |
        One baseline per app and branch: the latest run of the base branch that
        was green, or that seeded the baseline (see the README).
      responses:
        "200":
          description: The baselines, empty if no run was a baseline yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestBaselinesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCredentials
      summary: The credentials of the flavors of a project.
      description: |
        Oldest first. A credential never shows its secret: only who it belongs
        to (`account`, when that is not secret), what the last check found
        (`status`, `checkedAt`, `verifiedAt`) and, if the check did not accept
        it, why (`message`) and what to do (`fix`).

        With `flavor` (and `app`, `.` unless given) only the credentials of
        that flavor.
      parameters:
        - name: app
          in: query
          required: false
          description: The path of the app; needs `flavor`.
          schema:
            type: string
        - name: flavor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveCredential
      summary: Verify a credential and store it, new or replacing.
      description: |
        The store or tool the credential is for must accept it, else nothing
        is stored: `422 credential_rejected` says why and what to do (an
        expired ASC key, a revoked app-specific password, a service account
        Google does not know, a wrong keystore password, a Shorebird key
        without the `sb_api_` prefix). If the check cannot be made (the store
        is not reachable, a tool is missing) the answer is `502
        upstream_error` and nothing is stored either.

        A flavor has one credential of each kind: saving again replaces it
        (`200`); the first save answers `201`. The secret goes to the engine's
        secret store (D-07) and is never returned, logged or sent in an event.

        The body names the flavor (`app`, default `.`, and `flavor`), the
        `kind` and the secret fields of that kind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCredentialRequest"
      responses:
        "200":
          description: The credential replaced an earlier one and was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "201":
          description: The credential was accepted and stored.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials/{credentialId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: verifyCredential
      summary: Check a credential again now.
      description: |
        Runs the check of the credential's kind with the stored secret and
        keeps the result, like the daily health check. A credential that the
        store now refuses is still a `200`: the body has `status: rejected`
        with `message` and `fix`. A credential that was accepted before and is
        refused now is announced as `credential.expired`, and a job that needs
        it fails preflight (the `credentials` guard check) until it is
        replaced.
      responses:
        "200":
          description: The credential with the result of the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CredentialId"
    delete:
      operationId: deleteCredential
      summary: Delete a credential and its secret.
      description: |
        The secret goes too, unless another credential keeps it under the same
        key (the engine has one GitHub token).
      responses:
        "204":
          description: The credential is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWorkflows
      summary: The workflows of a project, by name.
      description: |
        The built-in workflows (`dev-build`, `prod-release`, `shorebird-patch`,
        `test`) are made for the project the first time they are asked for, and
        brought up to date when the engine's version of one changes. Each
        workflow shows its newest version.
      responses:
        "200":
          description: The workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createWorkflow
      summary: Create a workflow from a YAML document.
      description: |
        The document must be valid (`POST .../workflows/validate` lists its
        issues with their lines): otherwise `422 workflow_invalid`, and the
        message lists the issues. The name is unique in the project. To change
        a built-in workflow, create a workflow of your own with its YAML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: The workflow, at version 1.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/validate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: validateWorkflow
      summary: Check a workflow document without saving it.
      description: |
        Answers `200` whether or not the document is valid; the issues carry
        their line and column. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowYamlRequest"
      responses:
        "200":
          description: The result of the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateWorkflowResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getWorkflow
      summary: A workflow with the YAML of one of its versions.
      parameters:
        - name: version
          in: query
          required: false
          description: The number of the version. The newest by default.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveWorkflow
      summary: Save a new version of a workflow.
      description: |
        Every save makes a new version; jobs that were dispatched keep the
        version they ran. A built-in workflow answers `409 conflict`. An
        invalid document answers `422 workflow_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowYamlRequest"
      responses:
        "200":
          description: The workflow at its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow of your own.
      description: |
        A built-in workflow, and a workflow that jobs ran, answer `409
        conflict`: the jobs keep the version they ran.
      responses:
        "204":
          description: The workflow is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/{workflowId}/dispatch:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkflowId"
    post:
      operationId: dispatchWorkflow
      summary: Run a workflow.
      description: |
        Fetches the mirror, resolves `ref` to a commit, allocates the build
        number (D-11), expands the matrix into jobs and queues them. The jobs
        run when the scheduler has a runner with the capabilities and a free
        slot for them: a workflow that locks the project (a production
        release or patch) waits as long as another such run of the project is
        under way (the jobs stay `queued` and say why). A job that reaches a
        gate stops in `waiting_for_approval` until the action is approved
        (D-13).

        `422 workflow_invalid` when the document no longer is valid or the
        request asks for something the project cannot do (an unknown flavor,
        a step without a credential it needs); the message says what.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "202":
          description: The run, with its jobs.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: A run with the state of its jobs.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      summary: Cancel every job of a run that has not ended.
      description: |
        Like `POST /jobs/{id}/cancel` for each job that is queued, running,
        interrupted or waiting. A run whose jobs all ended answers `409
        conflict`.
      responses:
        "200":
          description: The run after the cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A device token created with `xpd token create`.
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: The job id, for example `job_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ArtifactId:
      name: id
      in: path
      required: true
      description: The artifact id, for example `art_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      description: The project id, for example `prj_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    WorkflowId:
      name: workflowId
      in: path
      required: true
      description: The workflow id, for example `wf_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    RunId:
      name: id
      in: path
      required: true
      description: The run id, for example `run_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential id, for example `crd_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
  responses:
    WorkflowInvalid:
      description: |
        The workflow document has issues, or the dispatch asks for something
        the project cannot do. The message lists them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CredentialRejected:
      description: |
        The credential was not stored: the store or tool it is for refused it,
        or it is not usable. The message says why and what to do.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        There is no such project, job, artifact or test run, or GitHub cannot
        find the repository.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        The request clashes with what the engine holds: the repository is a
        project already, the project has releases or jobs, or the job is not
        in a state that allows the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: GitHub or git refused the call or could not be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecretsLocked:
      description: The engine cannot read its secrets right now (D-10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The bearer token is missing, unknown or revoked.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResyncRequired:
      description: The event cursor is outside the resume window.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpgradeRequired:
      description: The route only speaks WebSocket.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Something went wrong in the engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthorized
        - not_found
        - conflict
        - resync_required
        - credential_rejected
        - workflow_invalid
        - upgrade_required
        - internal
        - upstream_error
        - secrets_locked
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    VersionResponse:
      type: object
      required: [version, apiVersion]
      additionalProperties: false
      properties:
        version:
          type: string
          description: The engine's own version.
        apiVersion:
          type: string
          description: Major version of this API.
    SequencedEvent:
      type: object
      required: [seq, at, type, payload]
      properties:
        seq:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        type:
          type: string
          description: |
            `engine.started`, `stream.opened`, `project.added`,
            `project.scanned`, `project.removed`, `job.state_changed`,
            `job.step_changed`, `test_run.completed`, `credential.saved`,
            `credential.verified`, `credential.expired`, `credential.removed`,
            `workflow.saved`, `workflow.removed`, `run.dispatched`,
            or a type added by a
            later engine version, which a client must ignore.
        payload:
          type: object
    FindingSeverity:
      type: string
      enum: [error, warning, info]
    Finding:
      type: object
      description: |
        Something a scan noticed, with what to change to resolve it.
      required: [severity, code, message, fix]
      additionalProperties: false
      properties:
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        code:
          type: string
          description: A stable snake_case identifier.
        message:
          type: string
        fix:
          type: string
        path:
          type: string
          description: The file it is about, relative to the repository root.
        app:
          type: string
          description: The path of the app it is about.
        flavor:
          type: string
    PlistVersion:
      type: object
      required: [path, literal]
      additionalProperties: false
      properties:
        path:
          type: string
        shortVersion:
          type: string
          description: CFBundleShortVersionString as written.
        buildNumber:
          type: string
          description: CFBundleVersion as written.
        literal:
          type: boolean
          description: |
            Whether either key is a literal rather than a build variable such
            as `$(FLUTTER_BUILD_NUMBER)`.
    KeystoreProfile:
      type: object
      required: [propertiesPath, propertiesPresent]
      additionalProperties: false
      properties:
        propertiesPath:
          type: string
        propertiesPresent:
          type: boolean
        storeFile:
          type: string
          description: Passwords are never read.
    ShorebirdProfile:
      type: object
      required: [flavorAppIds]
      additionalProperties: false
      properties:
        appId:
          type: string
        flavorAppIds:
          type: object
          additionalProperties:
            type: string
    FlavorProfile:
      type: object
      required:
        - name
        - implicit
        - entrypoint
        - shorebird
        - prod
        - versionFiles
        - sources
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            The flavor name; `default` for an implicit flavor, which stands
            for the only build of an app without flavors.
        implicit:
          type: boolean
        entrypoint:
          type: string
          description: Relative to the app.
        iosBundleId:
          type: string
        androidAppId:
          type: string
        iosTeam:
          type: string
        iosScheme:
          type: string
        infoPlist:
          type: string
          description: Relative to the repository root.
        shorebird:
          type: boolean
        shorebirdAppId:
          type: string
        prod:
          type: boolean
        versionFiles:
          type: array
          description: |
            The files a version bump writes, relative to the repository root.
          items:
            type: string
        sources:
          type: array
          items:
            type: string
            enum: [gradle, flavorizr, xcscheme, entrypoint]
    IosPackageManager:
      type: string
      enum: [cocoapods, spm, both, none]
    AppProfile:
      type: object
      required:
        - name
        - path
        - framework
        - storeCountry
        - hasIos
        - hasAndroid
        - iosPackageManager
        - flavors
        - plists
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
          description: Relative to the repository root; `.` for the root.
        framework:
          type: string
          const: flutter
        version:
          type: string
        storeCountry:
          type: string
          description: Two-letter App Store storefront, lower case.
        flutterVersion:
          type: string
          description: The pin of `.fvmrc` (D-20).
        flutterVersionSource:
          type: string
        hasIos:
          type: boolean
        hasAndroid:
          type: boolean
        iosPackageManager:
          $ref: "#/components/schemas/IosPackageManager"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorProfile"
        plists:
          type: array
          items:
            $ref: "#/components/schemas/PlistVersion"
        keystore:
          $ref: "#/components/schemas/KeystoreProfile"
        shorebird:
          $ref: "#/components/schemas/ShorebirdProfile"
    BranchLayout:
      type: object
      required: [releaseBranches]
      additionalProperties: false
      properties:
        defaultBranch:
          type: string
        releaseBranches:
          type: array
          description: Existing branches that match `release/*`.
          items:
            type: string
    RepoWorkflow:
      type: object
      required: [path, provider, names]
      additionalProperties: false
      properties:
        path:
          type: string
        provider:
          type: string
          enum: [github_actions, codemagic]
        names:
          type: array
          items:
            type: string
    ProjectProfile:
      type: object
      required: [layout, apps, branches, workflows]
      additionalProperties: false
      properties:
        layout:
          type: string
          enum: [single, melos]
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppProfile"
        branches:
          $ref: "#/components/schemas/BranchLayout"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/RepoWorkflow"
    Project:
      type: object
      required:
        - id
        - githubRepoId
        - fullName
        - remote
        - defaultBaseBranch
        - profile
        - findings
      additionalProperties: false
      properties:
        id:
          type: string
        githubRepoId:
          type: integer
          description: Survives renames and transfers; keys the project (D-05).
        fullName:
          type: string
          description: "`owner/name` as GitHub spells it."
        remote:
          type: string
        localPath:
          type: string
          description: |
            The folder the project was added from. It only seeds scans.
        defaultBaseBranch:
          type: string
        profile:
          $ref: "#/components/schemas/ProjectProfile"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        scannedAt:
          type: string
          format: date-time
    ProjectsResponse:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    AddProjectRequest:
      type: object
      description: Exactly one of `path` and `remote`.
      additionalProperties: false
      properties:
        path:
          type: string
        remote:
          type: string
      oneOf:
        - required: [path]
        - required: [remote]
    FlavorEdit:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        prod:
          type: boolean
        shorebird:
          type: boolean
        entrypoint:
          type: string
        iosBundleId:
          type: string
        androidAppId:
          type: string
        versionFiles:
          type: array
          items:
            type: string
    AppEdit:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
        storeCountry:
          type: string
          pattern: "^[A-Za-z]{2}$"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorEdit"
    ProfileEdits:
      type: object
      additionalProperties: false
      properties:
        defaultBaseBranch:
          type: string
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppEdit"
    JobState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - interrupted
        - waiting_for_resume
        - waiting_for_approval
    StepState:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - skipped
        - cancelled
        - interrupted
        - waitingForApproval
    JobStep:
      type: object
      required: [ordinal, kind, state, sideEffect, attempts]
      additionalProperties: false
      properties:
        ordinal:
          type: integer
          minimum: 0
        kind:
          type: string
          description: The step type, for example `command`.
        state:
          $ref: "#/components/schemas/StepState"
        sideEffect:
          type: boolean
          description: |
            Whether the step changes something outside the engine. The engine
            never repeats such a step by itself (D-18).
        attempts:
          type: integer
          minimum: 0
        result:
          type: object
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    Job:
      type: object
      required: [id, projectId, workflowVersionId, state, createdAt, steps]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        workflowVersionId:
          type: string
        releaseId:
          type: string
        sha:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        runnerId:
          type: string
        runId:
          type: string
          description: The run the job belongs to, if it was dispatched.
        name:
          type: string
          description: What the workflow calls the job, for example `build (android, dev)`.
        stage:
          type: integer
          minimum: 0
          description: |
            The stage of the workflow the job is in. A stage starts when every
            job of the stages before it succeeded.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        message:
          type: string
          description: Why the job failed or was cancelled, or why it still waits.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
    Capability:
      type: string
      description: |
        What a runner can do (D-19). The engine probes them; it does not trust
        what a runner says about itself.
      enum:
        - ios-sign
        - android
        - flutter
        - swift-linux
    WorkflowVersionInfo:
      type: object
      required: [id, version, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id `Job.workflowVersionId` refers to.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    Workflow:
      type: object
      required: [id, projectId, name, builtin, version, versions, yaml]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        builtin:
          type: boolean
          description: Made by the engine; cannot be edited or deleted.
        version:
          $ref: "#/components/schemas/WorkflowVersionInfo"
        versions:
          type: array
          description: Every version, oldest first.
          items:
            $ref: "#/components/schemas/WorkflowVersionInfo"
        yaml:
          type: string
          description: The workflow document of `version`.
    WorkflowSummary:
      type: object
      required: [id, projectId, name, builtin, version]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        builtin:
          type: boolean
        version:
          $ref: "#/components/schemas/WorkflowVersionInfo"
    WorkflowsResponse:
      type: object
      required: [workflows]
      additionalProperties: false
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowSummary"
    CreateWorkflowRequest:
      type: object
      required: [name, yaml]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        yaml:
          type: string
    WorkflowYamlRequest:
      type: object
      required: [yaml]
      additionalProperties: false
      properties:
        yaml:
          type: string
    WorkflowIssue:
      type: object
      required: [line, column, message]
      additionalProperties: false
      properties:
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        message:
          type: string
    ValidateWorkflowResponse:
      type: object
      required: [valid, issues]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowIssue"
    VersionBump:
      type: string
      enum:
        - major
        - minor
        - patch
        - keep
    DispatchRequest:
      type: object
      additionalProperties: false
      properties:
        ref:
          type: string
          description: |
            The branch, tag or commit to run on; the base branch of the project
            by default.
        app:
          type: string
          description: The path of the app (`.` for the root); needed when the project has several.
        flavors:
          type: array
          items:
            type: string
          description: |
            The flavors to run for. Workflows that lock the project take the
            production flavors by default, the others take the rest.
        platforms:
          type: array
          items:
            type: string
            enum: [android, ios]
          description: The platforms to run for; what the app has by default.
        bump:
          $ref: "#/components/schemas/VersionBump"
        version:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          description: The version to release, instead of `bump`.
        releaseVersion:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+\\+\\d+$"
          description: The release a patch applies to, `x.y.z+build`.
        inputs:
          type: object
          description: The values of the inputs the workflow declares.
    RunState:
      type: string
      enum:
        - queued
        - running
        - waiting_for_approval
        - succeeded
        - failed
        - cancelled
    RunJob:
      type: object
      required: [id, name, stage, state]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        stage:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        message:
          type: string
    Run:
      type: object
      required:
        [
          id,
          projectId,
          workflowId,
          workflowVersionId,
          sha,
          state,
          locksProject,
          createdAt,
          jobs,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        workflowId:
          type: string
        workflowVersionId:
          type: string
        sha:
          type: string
          description: The commit every job starts from, in full.
        ref:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        locksProject:
          type: boolean
          description: |
            Whether the run holds the project: one production release or patch
            at a time (D-11).
        version:
          type: string
        build:
          type: integer
          description: The build number allocated at dispatch (D-11).
        createdAt:
          type: string
          format: date-time
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RunJob"
    ResumeJobRequest:
      type: object
      additionalProperties: false
      properties:
        fromStep:
          type: integer
          minimum: 0
          description: |
            Re-run from the step with this ordinal. Without it the job resumes
            at its first unfinished step.
    ArtifactKind:
      type: string
      enum:
        - ipa
        - aab
        - apk
        - mapping
        - dsym
        - manifest
        - shorebird_symbols
    Artifact:
      type: object
      required: [id, jobId, kind, name, size, sha256, pinned, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        jobId:
          type: string
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        name:
          type: string
          description: The file name, such as `dev-1.0.0+7.apk`.
        size:
          type: integer
          minimum: 0
          description: Bytes.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pinned:
          type: boolean
          description: A pinned artifact is kept when the engine frees up space.
        createdAt:
          type: string
          format: date-time
    ArtifactsResponse:
      type: object
      required: [artifacts]
      additionalProperties: false
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    TestStatus:
      type: string
      enum: [passed, failed, errored, skipped]
    TestRef:
      type: object
      required: [suite, name]
      additionalProperties: false
      properties:
        suite:
          type: string
          description: The test file relative to the app.
        name:
          type: string
          description: The full test name with the names of its groups.
    TestCase:
      type: object
      required: [suite, name, status]
      additionalProperties: false
      properties:
        suite:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TestStatus"
        message:
          type: string
        stackTrace:
          type: string
    TestCounts:
      type: object
      required: [total, passed, failed, errored, skipped]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        errored:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    TestRunDiff:
      type: object
      required: [newFailures, fixed, missing, stillFailing]
      additionalProperties: false
      properties:
        comparedTo:
          type: string
          description: |
            The job of the baseline this was compared with. Absent if there was
            no baseline, so that every failure is new.
        newFailures:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        fixed:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        stillFailing:
          type: integer
          minimum: 0
    TestRun:
      type: object
      required:
        [id, jobId, branch, appPath, baseline, createdAt, counts, diff]
      additionalProperties: false
      properties:
        id:
          type: string
        jobId:
          type: string
        branch:
          type: string
        appPath:
          type: string
        baseline:
          type: boolean
          description: Whether this run became the baseline of its app and branch.
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/TestCounts"
        diff:
          $ref: "#/components/schemas/TestRunDiff"
    TestRunResponse:
      type: object
      required: [run, total, offset, tests]
      additionalProperties: false
      properties:
        run:
          $ref: "#/components/schemas/TestRun"
        total:
          type: integer
          minimum: 0
          description: How many tests match the request, over all pages.
        offset:
          type: integer
          minimum: 0
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
    TestBaseline:
      type: object
      required: [appPath, branch, jobId, createdAt, counts]
      additionalProperties: false
      properties:
        appPath:
          type: string
        branch:
          type: string
        jobId:
          type: string
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/TestCounts"
    TestBaselinesResponse:
      type: object
      required: [baselines]
      additionalProperties: false
      properties:
        baselines:
          type: array
          items:
            $ref: "#/components/schemas/TestBaseline"
    LogLineFrame:
      type: object
      required: [type, seq, step, at, stream, text]
      additionalProperties: false
      properties:
        type:
          type: string
          const: line
        seq:
          type: integer
          minimum: 1
        step:
          type: integer
          minimum: 0
          description: The ordinal of the step that wrote the line.
        at:
          type: string
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
    LogGapFrame:
      type: object
      required: [type, fromSeq, toSeq, count]
      additionalProperties: false
      properties:
        type:
          type: string
          const: gap
        fromSeq:
          type: integer
          minimum: 1
        toSeq:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
    LogEndFrame:
      type: object
      required: [type, state]
      additionalProperties: false
      properties:
        type:
          type: string
          const: end
        state:
          $ref: "#/components/schemas/JobState"
    LogFrame:
      oneOf:
        - $ref: "#/components/schemas/LogLineFrame"
        - $ref: "#/components/schemas/LogGapFrame"
        - $ref: "#/components/schemas/LogEndFrame"
    CredentialKind:
      type: string
      enum:
        - asc_key
        - apple_id
        - play_sa
        - firebase_sa
        - keystore
        - shorebird
        - github
        - slack
    CredentialStatus:
      type: string
      description: |
        `unverified`: never checked. `verified`: accepted at the last check.
        `rejected`: refused at the last check (expired, revoked, wrong); a job
        that needs it fails preflight. `unreachable`: the last check could not
        be made, so it says nothing about the credential.
      enum: [unverified, verified, rejected, unreachable]
    Credential:
      type: object
      description: A credential of a flavor. It never carries the secret.
      required: [id, projectId, app, flavor, kind, status]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        app:
          type: string
          description: The path of the app of the flavor; `.` for the root.
        flavor:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        status:
          $ref: "#/components/schemas/CredentialStatus"
        account:
          type: string
          description: |
            Who it belongs to, when that is not secret: the Apple ID, the key
            id, the service account email, the keystore alias, the GitHub
            login.
        verifiedAt:
          type: string
          format: date-time
          description: When a check last accepted it.
        checkedAt:
          type: string
          format: date-time
          description: When it was last checked.
        message:
          type: string
          description: Why the last check did not accept it.
        fix:
          type: string
          description: What to do about `message`.
    CredentialsResponse:
      type: object
      required: [credentials]
      additionalProperties: false
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
    AscKeyCredentialRequest:
      type: object
      required: [flavor, kind, keyId, issuerId, privateKey]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          const: asc_key
        keyId:
          type: string
        issuerId:
          type: string
        privateKey:
          type: string
          description: The text of the `.p8` file.
        keyKind:
          type: string
          enum: [team, individual]
          description: "`team` unless told otherwise."
    AppleIdCredentialRequest:
      type: object
      required: [flavor, kind, appleId, password]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          const: apple_id
        appleId:
          type: string
        password:
          type: string
          description: |
            An app-specific password (`abcd-efgh-ijkl-mnop`), not the password
            of the Apple ID.
    ServiceAccountCredentialRequest:
      type: object
      required: [flavor, kind, serviceAccount]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          enum: [play_sa, firebase_sa]
        serviceAccount:
          type: string
          description: The text of the JSON key file of the service account.
    KeystoreCredentialRequest:
      type: object
      required: [flavor, kind, keystore, storePassword, keyAlias]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          const: keystore
        keystore:
          type: string
          description: The keystore file, base64 encoded.
        storePassword:
          type: string
        keyAlias:
          type: string
        keyPassword:
          type: string
          description: The store password unless given.
    TokenCredentialRequest:
      type: object
      required: [flavor, kind, token]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          enum: [shorebird, github]
        token:
          type: string
          description: |
            A Shorebird API key (`sb_api_*`) or a GitHub token. The engine has
            one GitHub token, shared by every project.
    SlackCredentialRequest:
      type: object
      required: [flavor, kind, webhookUrl]
      additionalProperties: false
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          const: slack
        webhookUrl:
          type: string
    SaveCredentialRequest:
      description: |
        Which flavor and kind, and the secret fields of that kind.
      oneOf:
        - $ref: "#/components/schemas/AscKeyCredentialRequest"
        - $ref: "#/components/schemas/AppleIdCredentialRequest"
        - $ref: "#/components/schemas/ServiceAccountCredentialRequest"
        - $ref: "#/components/schemas/KeystoreCredentialRequest"
        - $ref: "#/components/schemas/TokenCredentialRequest"
        - $ref: "#/components/schemas/SlackCredentialRequest"
