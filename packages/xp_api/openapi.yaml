openapi: 3.1.0
info:
  title: XPath engine API
  version: "1"
  summary: HTTP/JSON plus one WebSocket, served by xpd.
  description: |
    Hand-maintained; it grows phase by phase. Every response in the test
    suite is validated against this file (tests tagged `contract`).

    Every route except `/health` and `/version` needs a device token:
    `Authorization: Bearer <token>`. Errors are always
    `{"error": {"code": "...", "message": "..."}}`.

    A token of kind `runner` (a paired runner's credential) reaches only the
    three routes made for runners: `GET /runners/connect`,
    `GET /runners/bundle` and
    `PUT /runners/jobs/{id}/artifacts/{name}` (ADR 0011). Every other route
    answers it `403 forbidden`, whatever the route says about other kinds of
    token. `POST /runners/pair` needs no token.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:7480
    description: Default loopback address of a local engine.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: The engine is serving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /version:
    get:
      operationId: getVersion
      summary: Engine and API version, for compatibility checks before pairing.
      security: []
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /events:
    get:
      operationId: streamEvents
      summary: WebSocket stream of engine events.
      description: |
        Upgrade to a WebSocket (browsers are refused: any `Origin` header is
        rejected). Every text frame is one JSON `SequencedEvent`.

        The first frame is always `stream.opened`; its `seq` is the head of
        the event log. With `after=<seq>` the engine then replays every
        logged event with a greater `seq`, in order, and continues with live
        events. Without `after` only live events follow. A client stores the
        `seq` of the last event it handled and reconnects with that value.

        When `after` is older than the retained window, or newer than the
        head (the engine restarted), the response is `409 resync_required`:
        reload state over HTTP and reconnect without `after`. If the window
        is lost after the upgrade, the engine closes the socket with code
        4409 instead.

        On shutdown the engine closes the socket with code 1000 (normal
        closure) and the reason `engine shutting down`.
      parameters:
        - name: after
          in: query
          required: false
          description: Last `seq` the client has seen.
          schema:
            type: integer
            minimum: 0
      responses:
        "101":
          description: Switching Protocols. Frames follow `SequencedEvent`.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ResyncRequired"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects:
    get:
      operationId: listProjects
      summary: Every project, oldest first.
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addProject
      summary: Add a GitHub repository as a project, and scan it.
      description: |
        Give exactly one of `path` and `remote`.

        With `path` (an absolute folder on the engine's machine), the engine
        reads the `origin` of the clone to find the repository, asks GitHub
        for it, sets up its own mirror and scans the folder. The folder only
        identifies the repository and seeds the scan (D-05); nothing is
        written to it (D-04).

        With `remote` (`owner/name` or a GitHub URL), the engine fetches the
        repository into its mirror and scans the default branch there.

        Projects are keyed by the GitHub repository id: a repository that is a
        project already answers `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProjectRequest"
      responses:
        "201":
          description: The project was added.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: One project, with its profile and the findings of the last scan.
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProject
      summary: Edit the profile of a project.
      description: |
        The edits are kept apart from the scan and applied again after every
        scan, so a rescan never undoes them. Fields that are left out keep
        their value; edits merge with earlier ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileEdits"
      responses:
        "200":
          description: The project with the edits applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeProject
      summary: Remove a project.
      description: |
        The engine's mirror stays on disk and the folder the project was added
        from is never touched. A project with releases or jobs cannot be
        removed.
      responses:
        "204":
          description: The project is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/scan:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: scanProject
      summary: Scan a project again.
      description: |
        Scans the folder the project was added from if it still exists, else a
        fresh worktree of the engine's mirror at the default branch. GitHub is
        asked for the repository first, so a rename or a new default branch is
        followed; if GitHub cannot be reached the stored values stay.
      responses:
        "200":
          description: The project with the new scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      summary: One job, with its steps.
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelJob
      summary: Cancel a job.
      description: |
        Stops the process tree of the running step: `SIGTERM` to its process
        group, ten seconds of grace, then `SIGKILL` (ADR 0003). The response
        comes once the job has ended, so it can take up to ten seconds. A job
        that is not running (queued, interrupted, waiting for a resume) is
        cancelled at once. A job that has ended answers `409 conflict`.
      responses:
        "200":
          description: The cancelled job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: resumeJob
      summary: Resume a job at its first unfinished step.
      description: |
        Valid for a job that is `failed`, `cancelled`, `interrupted`,
        `waiting_for_resume` or `waiting_for_approval`. A job that is part
        of a run goes back in the queue of the scheduler and takes its turn
        (a production release waits for the project, a job waits for a free
        slot): the answer is the job, `queued` or `running`. Steps that succeeded or were skipped are not run
        again (D-18). A step with side effects that was started before asks
        its store whether the work exists already (`alreadyDone`) and is
        skipped if so; only a resume ever runs it again. The job runs in the
        background: follow `job.state_changed` on `/events` or the log
        WebSocket.

        With `fromStep` the job re-runs from that step even if it and later
        steps succeeded; every earlier step must be done.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeJobRequest"
      responses:
        "202":
          description: The job is running again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: streamJobLogs
      summary: WebSocket stream of a job's log lines.
      description: |
        Upgrade to a WebSocket (browsers are refused, as for `/events`). Every
        text frame is one JSON `LogFrame`. Lines are masked before they are
        stored or sent: known secret values read `***`.

        The engine replays the lines of the job with a `seq` greater than
        `after` (default 0, the whole log), then follows the job live. `seq`
        counts the lines of the whole job from 1, across its steps, and
        survives a resume. A client stores the `seq` of the last line it
        handled and reconnects with that value.

        A frame queue is bounded: a client that falls behind, for example
        while it replays a long log of a job that keeps writing, gets a `gap`
        frame in place of the lines it missed (they are in the log; reconnect
        with `after` to read them). When the job is not running (it ended, or
        is interrupted or waiting for a resume) and everything was sent, the
        last frame is `end`, with the state the job is in, and the engine
        closes the socket with code 1000.

        An `after` greater than the newest line answers `409 resync_required`.
      parameters:
        - name: after
          in: query
          required: false
          description: Last `seq` the client has seen.
          schema:
            type: integer
            minimum: 0
      responses:
        "101":
          description: Switching Protocols. Frames follow `LogFrame`.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ResyncRequired"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: listJobArtifacts
      summary: The files a job produced.
      description: |
        The builds (`apk`, `aab`, `ipa`) and the manifest the job stored, oldest
        first. A job that produced nothing answers an empty list.
      responses:
        "200":
          description: The artifacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getArtifact
      summary: One artifact's metadata.
      responses:
        "200":
          description: The artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: downloadArtifact
      summary: The content of an artifact.
      description: |
        Streams the stored file. `Content-Length` is its size and
        `X-Content-SHA256` its SHA-256 in lowercase hexadecimal, so a client
        can verify what it saved.
      responses:
        "200":
          description: The file.
          headers:
            Content-Length:
              schema:
                type: integer
            X-Content-SHA256:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/pin:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: pinArtifact
      summary: Keep an artifact when the engine frees up space.
      description: Pinning a pinned artifact changes nothing.
      responses:
        "200":
          description: The artifact, pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /artifacts/{id}/unpin:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: unpinArtifact
      summary: Let the engine remove an artifact when it frees up space.
      description: Unpinning an artifact that is not pinned changes nothing.
      responses:
        "200":
          description: The artifact, not pinned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /jobs/{id}/tests:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJobTests
      summary: The test run of a job, with what changed against the baseline.
      description: |
        The `test` step stores one run per job. `diff` says which tests fail
        that did not fail in the baseline (`newFailures`), which were fixed and
        which the baseline had and this run did not report. `tests` is a page
        of the run's tests ordered by file and name; by default only the tests
        that failed or threw.
      parameters:
        - name: status
          in: query
          description: |
            Comma-separated statuses to list. Defaults to `failed,errored`.
          schema:
            type: string
            example: failed,errored
        - name: limit
          in: query
          description: How many tests to list at most. Defaults to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          description: How many matching tests to skip.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/tests/baseline:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectTestBaselines
      summary: The runs that new test runs of a project are compared with.
      description: |
        One baseline per app and branch: the latest run of the base branch that
        was green, or that seeded the baseline (see the README).
      responses:
        "200":
          description: The baselines, empty if no run was a baseline yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestBaselinesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /credentials:
    get:
      operationId: listNamedCredentials
      summary: The named credentials of the engine.
      description: |
        By name. Any flavor of any project may use a credential; `usedBy`
        lists the flavors that do, each with the check of its assignment.
        A credential never shows its secret: only who it belongs to
        (`account`, when that is not secret), what the last check found
        (`status`, `checkedAt`, `verifiedAt`) and, if the check did not accept
        it, why (`message`) and what to do (`fix`). The GitHub token is not a
        named credential (`/github-token`).
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredentialsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createCredential
      summary: Verify a credential and store it under a name.
      description: |
        The store or tool the credential is for must accept it, else nothing
        is stored: `422 credential_rejected` says why and what to do (an
        expired ASC key, a revoked app-specific password, a service account
        Google does not know, a wrong keystore password, a Shorebird key
        without the `sb_api_` prefix). If the check cannot be made (the store
        is not reachable, a tool is missing) the answer is `502
        upstream_error` and nothing is stored either. The secret goes to the
        engine's secret store (D-07) and is never returned, logged or sent in
        an event.

        Names are unique regardless of case (`409 conflict`). Identical
        secrets under two names stay two credentials. A new credential is
        used by no flavor; assign it with
        `PUT /projects/{id}/flavors/{flavor}/credentials/{kind}`. Only `app`
        and `cli` tokens may create credentials (`403 forbidden`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredentialRequest"
      responses:
        "201":
          description: The credential was accepted and stored.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredential"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    get:
      operationId: getNamedCredential
      summary: A named credential, with the flavors that use it.
      responses:
        "200":
          description: The credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: renameCredential
      summary: Rename a credential.
      description: |
        The id, the secret and every assignment stay. Names are unique
        regardless of case (`409 conflict`). Only `app` and `cli` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameCredentialRequest"
      responses:
        "200":
          description: The credential with its new name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredential"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: replaceCredentialSecret
      summary: Verify a new secret for a credential and store it.
      description: |
        The body holds the secret fields of the credential's kind (as for
        `POST /credentials`). The new secret is checked first and nothing
        changes if it is refused (`422`) or cannot be checked (`502`). The id,
        the name and every assignment stay; the assignments are checked
        again with the new secret. Only `app` and `cli` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCredentialRequest"
      responses:
        "200":
          description: The credential with its new secret checked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredential"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNamedCredential
      summary: Delete a credential and its secret.
      description: |
        A credential that flavors use is not deleted unless `force=true`:
        the answer is `409 credential_in_use` with the flavors (`usedBy`).
        With `force=true` those flavors give it up (they have no credential
        of the kind afterwards) and it is deleted. Only `app` and `cli`
        tokens.
      parameters:
        - name: force
          in: query
          required: false
          description: "`true` deletes a credential that flavors use."
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "204":
          description: The credential is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CredentialInUse"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /credentials/{credentialId}/verify:
    parameters:
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: verifyNamedCredential
      summary: Check a credential and its assignments again now.
      description: |
        Runs the check of the credential's kind with the stored secret
        (does it authenticate) and, for every flavor that uses it, the check
        of the assignment (can it reach the flavor's bundle id, package or
        app), and keeps the results, like the daily health check. A refusal
        is still a `200`: the credential or the usage has `status: rejected`
        with `message` and `fix`. Something that was accepted before and is
        refused now is announced as `credential.expired`, and a job that needs
        it fails preflight (the `credentials` guard check) until it is
        fixed. Only `app` and `cli` tokens.
      responses:
        "200":
          description: The credential with the results of the checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamedCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listCredentials
      summary: The credential each flavor of a project uses, by kind.
      description: |
        One entry per flavor and kind that has a credential: the named
        credential (`id`, `name`, `account`) with both checks: the
        credential's own (`credentialStatus`: does it authenticate) and the
        assignment's (`assignmentStatus`: can it reach this flavor's bundle
        id, package or app). `status`, `message` and `fix` combine them as
        preflight does: a refusal of either is a refusal.

        With `flavor` (and `app`, `.` unless given) only the credentials of
        that flavor.
      parameters:
        - name: app
          in: query
          required: false
          description: The path of the app; needs `flavor`.
          schema:
            type: string
        - name: flavor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveCredential
      deprecated: true
      summary: Verify a credential and use it for a flavor (deprecated).
      description: |
        Deprecated: create the credential with `POST /credentials` and assign
        it with `PUT /projects/{id}/flavors/{flavor}/credentials/{kind}`.
        This route stays for clients of the per-flavor credentials.

        The credential is checked as `POST /credentials` checks it, and
        nothing is stored if it is refused (`422`) or cannot be checked
        (`502`). If the flavor's credential of the kind is used by this
        flavor alone, it gets the new secret (`200`, same id and name).
        Otherwise a new named credential is created (`201`), called `name`
        or "<kind> · <project> <app> <flavor>", and the flavor uses it; other
        flavors keep what they have. A `github` token becomes the engine's
        GitHub token (`/github-token`) and no named credential.

        Only `app` and `cli` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCredentialRequest"
      responses:
        "200":
          description: The flavor's credential got the new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "201":
          description: A named credential was created and the flavor uses it.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/flavors/{flavor}/credentials/{kind}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/FlavorName"
      - $ref: "#/components/parameters/CredentialKindPath"
      - name: app
        in: query
        required: false
        description: The path of the app of the flavor; `.` unless given.
        schema:
          type: string
    put:
      operationId: assignCredential
      summary: Use a named credential for a flavor, or every flavor of its app.
      description: |
        The flavor uses the credential `credentialId` (of this `kind`) from
        now on, instead of any it had. With `allFlavors` every other flavor of
        the app uses it too, except a flavor that has another credential of
        the kind: it keeps it (`kept`) unless `replace`. Nothing else
        changes.

        Each assignment is checked at once (can the credential reach the
        flavor's bundle id, package or app) and the result is kept with it:
        a refusal does not undo the assignment, it fails preflight until
        fixed. Only `app` and `cli` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCredentialRequest"
      responses:
        "200":
          description: The flavors that use the credential now, and those that kept theirs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignCredentialResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unassignCredential
      summary: Stop using a credential of this kind for the flavor.
      description: |
        The flavor has no credential of the kind afterwards; the credential
        stays, with its other assignments. Only `app` and `cli` tokens.
      responses:
        "204":
          description: The flavor has no credential of the kind now.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials/{credentialId}/verify:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CredentialId"
    post:
      operationId: verifyCredential
      deprecated: true
      summary: Check a credential again now (deprecated).
      description: |
        Deprecated: use `POST /credentials/{credentialId}/verify`.

        Checks the credential and its assignments as that route does and
        answers with the credential as the first flavor of this project that
        uses it sees it. `404` when no flavor of the project uses it. Only
        `app` and `cli` tokens.
      responses:
        "200":
          description: The credential with the result of the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/CredentialId"
    delete:
      operationId: deleteCredential
      deprecated: true
      summary: Stop using a credential in a project (deprecated).
      description: |
        Deprecated: use `DELETE /projects/{id}/flavors/{flavor}/credentials/{kind}`
        and `DELETE /credentials/{credentialId}`.

        The flavors of this project give the credential up; if no other
        flavor uses it, it is deleted with its secret. `404` when no flavor of
        the project uses it. Only `app` and `cli` tokens.
      responses:
        "204":
          description: The project no longer uses the credential.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listProjectRuns
      summary: The runs of a project, newest first.
      description: Like `GET /runs?project={id}`, and `404` for no project.
      parameters:
        - name: workflow
          in: query
          required: false
          description: Only the runs of this workflow (an id).
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunState"
        - name: limit
          in: query
          required: false
          description: At most this many runs, 1 to 200; 50 by default.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: before
          in: query
          required: false
          description: |
            Only the runs dispatched before this one (a run id): the `next` of
            the page before.
          schema:
            type: string
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: listWorkflows
      summary: The workflows of a project, by name.
      description: |
        The built-in workflows (`dev-build`, `prod-release`, `shorebird-patch`,
        `test`) are made for the project the first time they are asked for, and
        brought up to date when the engine's version of one changes. Each
        workflow shows its newest version.
      responses:
        "200":
          description: The workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createWorkflow
      summary: Create a workflow from a YAML document.
      description: |
        The document must be valid (`POST .../workflows/validate` lists its
        issues with their lines): otherwise `422 workflow_invalid`, and the
        message lists the issues. The name is unique in the project. To change
        a built-in workflow, create a workflow of your own with its YAML and
        `basedOn` naming the built-in and its version: the app then offers to
        compare when the built-in changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: The workflow, at version 1.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
  /workflows/schema:
    get:
      operationId: getWorkflowSchema
      summary: What a workflow document may name.
      description: |
        The schema version, the step types with what each does and the typed
        keys it takes under `with`, the gates with their labels, the
        capabilities, the matrix axes, the platforms and the variables of this
        engine. Editors offer them; `POST /workflows/validate` still checks a
        document.
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSchema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /workflows/templates:
    get:
      operationId: listWorkflowTemplates
      summary: The documents a new workflow can start from.
      description: |
        Blank, Android to Firebase, iOS to TestFlight, tests only and a
        Shorebird patch, each valid as it is. Save one under a name with
        `POST /projects/{id}/workflows`.
      responses:
        "200":
          description: The templates, in the order to offer them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplatesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /workflows/validate:
    post:
      operationId: validateWorkflowDocument
      summary: Check a workflow document without a project.
      description: |
        The same check as `POST /projects/{id}/workflows/validate`: a document
        is valid or not whatever project it is for. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowYamlRequest"
      responses:
        "200":
          description: The result of the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateWorkflowResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/validate:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: validateWorkflow
      summary: Check a workflow document without saving it.
      description: |
        Answers `200` whether or not the document is valid; the issues carry
        their line and column. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowYamlRequest"
      responses:
        "200":
          description: The result of the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateWorkflowResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/{workflowId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkflowId"
    get:
      operationId: getWorkflow
      summary: A workflow with the YAML of one of its versions.
      parameters:
        - name: version
          in: query
          required: false
          description: The number of the version. The newest by default.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveWorkflow
      summary: Save a new version of a workflow.
      description: |
        Every save makes a new version; jobs that were dispatched keep the
        version they ran. A built-in workflow answers `409 conflict`. An
        invalid document answers `422 workflow_invalid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowYamlRequest"
      responses:
        "200":
          description: The workflow at its new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateWorkflow
      summary: Rename, archive or unarchive a workflow of your own.
      description: |
        No new version is made. An archived workflow keeps its versions and
        runs and is not dispatched. `basedOnVersion` marks a copy of a
        built-in as caught up with that version of it. A built-in workflow
        answers `409 conflict`, a name in use `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowRequest"
      responses:
        "200":
          description: The workflow at its newest version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteWorkflow
      summary: Delete a workflow of your own.
      description: |
        A built-in workflow, and a workflow that jobs ran, answer `409
        conflict`: the jobs keep the version they ran. Archive it instead.
      responses:
        "204":
          description: The workflow is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/workflows/{workflowId}/dispatch:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkflowId"
    post:
      operationId: dispatchWorkflow
      summary: Run a workflow.
      description: |
        Fetches the mirror, resolves `ref` to a commit, allocates the build
        number (D-11), expands the matrix into jobs and queues them. The jobs
        run when the scheduler has a runner with the capabilities and a free
        slot for them: a workflow that locks the project (a production
        release or patch) waits as long as another such run of the project is
        under way (the jobs stay `queued` and say why). A job that reaches a
        gate stops in `waiting_for_approval` until the action is approved
        (D-13).

        `422 workflow_invalid` when the document no longer is valid or the
        request asks for something the project cannot do (an unknown flavor,
        a step without a credential it needs); the message says what.

        With `dryRun=true` the engine plans the dispatch and starts nothing
        (UX-01): `200` with the plan, which lists the jobs it would start and
        where, the jobs it leaves out and why, the gates, and the version and
        build number it would take (no number is taken).
      parameters:
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "200":
          description: The plan of a dry run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchPlan"
        "202":
          description: The run, with its jobs.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The workflow is archived (`details.reason` is `archived`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs:
    get:
      operationId: listRuns
      summary: The runs, newest first, of every project or one.
      description: |
        Every run of the engine, wherever it was dispatched from (the app,
        the CLI, MCP). `next` is there when there may be more: pass it as
        `before`.
      parameters:
        - name: project
          in: query
          required: false
          description: Only the runs of this project (an id).
          schema:
            type: string
        - name: workflow
          in: query
          required: false
          description: Only the runs of this workflow (an id).
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RunState"
        - name: limit
          in: query
          required: false
          description: At most this many runs, 1 to 200; 50 by default.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: before
          in: query
          required: false
          description: |
            Only the runs dispatched before this one (a run id): the `next` of
            the page before.
          schema:
            type: string
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs/{id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: A run with the state of its jobs.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs/{id}/run-again:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: runAgain
      summary: Dispatch a run again.
      description: |
        A new run of the version of the workflow the run ran, at its commit,
        with its request (inputs, flavors, platforms, bump). It gets a build
        number of its own. What a dispatch refuses, this refuses.
      responses:
        "202":
          description: The new run, its jobs queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
  /runs/{id}/rerun-failed:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: rerunFailedJobs
      summary: Run the failed jobs of a run again.
      description: |
        Each failed, interrupted or waiting-for-resume job runs again from the
        step that failed; what the jobs before it made (their artifacts, the
        commit) is used as it is. A cancelled job is not run again. A run
        without such a job answers `409 conflict`.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      summary: Cancel every job of a run that has not ended.
      description: |
        Like `POST /jobs/{id}/cancel` for each job that is queued, running,
        interrupted or waiting. A run whose jobs all ended answers `409
        conflict`.
      responses:
        "200":
          description: The run after the cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals:
    get:
      operationId: listApprovals
      summary: The approval requests, newest first.
      description: |
        A gate (D-13) asks for an approval when a job reaches it: one request
        per project, action, commit, version and run. A request that nobody
        decided within 24 hours turns `expired` before it is listed. Expired
        counts as denied.

        `xp mcp` and other clients poll `GET /approvals/{id}` with the id a
        gated action returned; the owner's app lists `pending` ones here.
      parameters:
        - name: project
          in: query
          required: false
          description: Only the approvals of this project.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Only the approvals in this state.
          schema:
            $ref: "#/components/schemas/ApprovalState"
      responses:
        "200":
          description: The approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals/{id}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    get:
      operationId: getApproval
      summary: One approval request. Any token kind but `runner` (ADR 0011) may read it.
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      operationId: approveApproval
      summary: Approve the action. Only `app` and `cli` tokens may.
      description: |
        The first decision wins: the request moves from `pending` to
        `approved` in one compare-and-set, and the jobs that wait for it are
        resumed. A request that was decided already, or expired, answers `409
        already_decided` with the approval as it stands. An `mcp` or `runner`
        token answers `403 forbidden` (D-13: agents can never approve).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: The approval, now approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyDecided"
        "500":
          $ref: "#/components/responses/InternalError"
  /approvals/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      operationId: denyApproval
      summary: Deny the action. Only `app` and `cli` tokens may.
      description: |
        Like `POST /approvals/{id}/approve`: the first decision wins. The
        gate step of every job that waits for it fails with the reason.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: The approval, now denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyDecided"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/{id}/gates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectGates
      summary: Which actions of a project wait for an approval.
      description: |
        Every action is listed. A project that never set anything has all of
        them on.
      responses:
        "200":
          description: The gates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGates"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setProjectGates
      summary: Set which actions of a project wait for an approval.
      description: |
        Replaces the gates; an action left out is on. An `app` token may turn
        gates on and off. A `cli` token may only turn them on: a body that
        turns a gate off answers `403 forbidden`. `mcp` and `runner` tokens
        never change gates (D-13). Turning a gate off lets the jobs that wait
        at it go on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectGates"
      responses:
        "200":
          description: The gates now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGates"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases:
    get:
      operationId: listReleases
      summary: The releases, newest first.
      description: |
        A release is one flavor of an app going to the stores (D-17). The
        engine creates it when a production release is dispatched and moves
        it through `draft`, `building`, `uploaded`, `in_review`, `rejected`
        or `approved`, `live` and `merged` (or `abandoned`) as the jobs and
        the stores progress. Reading a release brings it up to date with its
        jobs; the stores are asked at most every ten minutes
        (`POST /releases/{id}/refresh` asks at once).
      parameters:
        - name: project
          in: query
          required: false
          description: Only the releases of this project.
          schema:
            type: string
        - name: app
          in: query
          required: false
          description: Only the releases of the app at this path.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Only the releases in this state.
          schema:
            $ref: "#/components/schemas/ReleaseState"
      responses:
        "200":
          description: The releases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getRelease
      summary: One release. Any token kind but `runner` (ADR 0011) may read it.
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: refreshRelease
      summary: Ask the stores about the release now.
      description: |
        Bypasses the ten-minute cache: App Store Connect (or the iTunes
        lookup for an Apple ID flavor) and Google Play are asked once, and
        the release moves if they say so. A store that cannot be read (no
        API key or service account) keeps its status and says why in
        `note`. Any token kind but `runner` (ADR 0011) may refresh.
      responses:
        "200":
          description: The release after the refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/stores/{store}/status:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
      - $ref: "#/components/parameters/ReleaseStoreName"
    post:
      operationId: setReleaseStoreStatus
      summary: Say what a store did, by hand. Only `app` and `cli` tokens may.
      description: |
        The buttons "Apple approved" and "Apple live" (an Apple ID flavor has
        no review API, D-14) and "Play: live" (no service account, D-15).
        Apple takes `approved` or `live`, Google Play `live`. The status
        only moves forward, and only once the store has the build. An `mcp`
        or `runner` token answers `403 forbidden`: a status moves the
        release toward the merge of its pull request, which only the owner
        may enable (D-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreStatusRequest"
      responses:
        "200":
          description: The release after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/builds:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: startReleaseBuild
      summary: Build the same version again with a new build number.
      description: |
        Offered once a store rejected the release (D-17). It dispatches the
        production workflow of the release again on its release branch, with
        the same version and a new build number (D-11: numbers are never
        reused), and links the run to the release. The release goes back to
        `building`. The workflow asks for the owner's approval like any
        production release. `409 conflict` unless the release is `rejected`.
      responses:
        "202":
          description: The run that builds it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: mergeRelease
      summary: Request the merge of the release pull request.
      description: |
        Open once every store targeted is live (`mergeEnabled`). It
        dispatches the `release-merge` workflow, whose merge is a gated
        action (D-13): the run waits for an `app` or `cli` token to approve
        it, and then merges the pull request with a merge commit (ADR 0007).
        Asking again while that run is under way answers with the same run.
        `409 conflict` unless the release is `live` and has its pull request.
      responses:
        "202":
          description: The run that merges it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/WorkflowInvalid"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/abandon:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    post:
      operationId: abandonRelease
      summary: Give the release up. Only `app` and `cli` tokens may.
      description: |
        Moves a release that is not over to `abandoned`. A run that still
        builds it is cancelled. `409 conflict` for a release that is merged or
        abandoned already.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbandonRequest"
      responses:
        "200":
          description: The release, abandoned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /releases/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/ReleaseId"
    get:
      operationId: getReleaseNotes
      summary: What changed in the release, ready to paste.
      description: |
        The commits between the tag of the release before this one and the
        commit of this release (merge commits left out), grouped by
        conventional-commit type, with the same text as Slack `mrkdwn` and as
        WhatsApp text (`*bold*`, no link markup). The release before is the
        newest non-patch tag of the same app and flavor with a lower version;
        a first release has none, and the notes are its latest commits. The
        engine reads its mirror of the repository and does not fetch.
        `409 conflict` while the release has no commit yet (`draft`,
        `building` before the tag). Any token kind but `runner` (ADR 0011) may read.
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /storage:
    get:
      operationId: getStorage
      summary: What the engine keeps on disk and what could be freed.
      description: |
        One entry per category (artifacts, logs, worktrees, orphan mirrors,
        Flutter SDKs nobody pins) with the bytes it holds and the bytes a
        `POST /storage/free` would give back, and the artifacts by app and
        flavor. It deletes nothing. Any token kind but `runner` (ADR 0011) may read.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /storage/free:
    post:
      operationId: freeStorage
      summary: Free up space, or say how much would be freed.
      description: |
        Without a body, or with `"dryRun": true`, it deletes nothing and says
        what it would. With `"dryRun": false` it deletes (D-13 lists delete
        as a gated action): only `app` and `cli` tokens may, as for a
        release `abandon`; the owner acting from the app or `xp` is the
        approval. `mcp` and `runner` tokens may only dry-run and otherwise
        get `403 forbidden`.

        Retention never deletes the artifacts of a release that is not over
        (`draft` to `live`), pinned artifacts, or the newest `keepPerFlavor`
        builds of each flavor. Job records are only removed when nothing
        needs them: a baseline test run, a release that is not over and
        artifacts that are kept all keep theirs.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeSpaceRequest"
      responses:
        "200":
          description: What was freed, or would be.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeSpaceResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /storage/retention:
    get:
      operationId: getRetention
      summary: How many builds per flavor and how many days of logs are kept.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setRetention
      summary: Set the retention. Only `app` and `cli` tokens may.
      description: |
        Replaces the settings; a field left out takes its default (5 builds,
        90 days). Both are at least 1. The daily log pruning uses `logDays`;
        artifacts are only removed by `POST /storage/free`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettings"
      responses:
        "200":
          description: The settings now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /github-token:
    get:
      operationId: getGitHubToken
      summary: Whether the engine has its GitHub token, and what GitHub says of it.
      description: |
        The engine has one GitHub token, shared by every project: it adds
        projects (`POST /projects` answers `502` without one), keeps the
        mirrors and pushes with it. With a token stored, this asks GitHub
        who it belongs to (`GET /user`) and answers with the login, or why
        GitHub refused it or could not be reached. The token is never in a
        response.
      responses:
        "200":
          description: The status of the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubTokenStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setGitHubToken
      summary: Check a GitHub token with GitHub, then store it. Only `app` and `cli` tokens may.
      description: |
        The token must be accepted by GitHub (`GET /user`) before it replaces
        the one the engine has; otherwise nothing is stored:
        `422 credential_rejected` when GitHub refused it, `502
        upstream_error` when GitHub could not be reached. The token is never
        logged or returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGitHubTokenRequest"
      responses:
        "200":
          description: Stored; the status of the new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubTokenStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteGitHubToken
      summary: Forget the GitHub token. Only `app` and `cli` tokens may.
      responses:
        "204":
          description: The engine has no GitHub token now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /github-token/import:
    post:
      operationId: importGitHubToken
      summary: Take the token of the GitHub CLI on the engine machine. Only `app` and `cli` tokens may.
      description: |
        What `xpd secrets import-gh` does, over the API: the engine runs
        `gh auth token` (the `gh` on its `PATH`, then
        `/opt/homebrew/bin/gh` and `/usr/local/bin/gh`), checks the token
        with GitHub and stores it as `PUT /github-token` does.
        `422 credential_rejected` when `gh` is missing, not logged in or its
        token is refused, `502 upstream_error` when GitHub could not be
        reached; nothing is stored then.
      responses:
        "200":
          description: Stored; the status of the new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubTokenStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/CredentialRejected"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/SecretsLocked"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners:
    get:
      operationId: listRunners
      summary: Every runner, oldest first, revoked ones included.
      description: |
        A runner is a machine that dials out to the engine and runs jobs
        (D-08). `status` is `online` while it is connected and probed.
        `capabilities` are what the engine found with its own probe, never
        what the runner says (D-19).
      responses:
        "200":
          description: The runners.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/pairing-tokens:
    post:
      operationId: createPairingToken
      summary: Create a pairing token for a new runner. Only `app` and `cli` tokens may.
      description: |
        The token is single use and valid for 15 minutes (D-08). Only its
        hash is kept, so the secret is shown here and never again. An `mcp`
        or `runner` token answers `403 forbidden`: pairing a machine lets it
        receive signing material.

        The name is the runner's; it must not belong to a runner already,
        revoked ones included (`409 conflict`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingTokenRequest"
      responses:
        "201":
          description: The pairing token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingToken"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/runner-url:
    get:
      operationId: getRunnerUrl
      summary: The address runners reach the engine at.
      description: |
        Every pairing token carries it as `engineUrl`, so the `xp runner pair`
        command it goes with works on the runner machine.
      responses:
        "200":
          description: The runner URL, if one is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setRunnerUrl
      summary: Set or clear the runner URL. Only `app` and `cli` tokens may.
      description: |
        An absolute `http` or `https` URL with a host and no user info, query
        or fragment; a trailing `/` is dropped. A plain `http` URL that is not
        loopback, a tailnet address (`100.64.0.0/10`) or a `*.ts.net` name is
        accepted with a `warning`: the runner connection carries signing
        material. Runners paired already keep the URL they were paired with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRunnerUrlRequest"
      responses:
        "200":
          description: The runner URL now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerUrl"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/pair:
    post:
      operationId: pairRunner
      summary: Exchange a pairing token for the runner's credential.
      description: |
        The one runner route that needs no bearer token: the pairing token in
        the body is the proof. The answer carries the new runner and its
        credential, a device token of kind `runner`, shown once; only its hash
        is kept. A pairing token that is unknown, expired or used answers `401
        unauthorized` with the reason.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRunnerRequest"
      responses:
        "201":
          description: The runner and its credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairRunnerResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    post:
      operationId: revokeRunner
      summary: Revoke a runner. Only `app` and `cli` tokens may.
      description: |
        Its credential stops working, its connection is closed and the leases
        it holds end at once. Each job it held is handled by the loss rule
        (D-08): queued again, or `waiting_for_resume` when it has a step with
        side effects. Revoking a revoked runner changes nothing.
      responses:
        "200":
          description: The runner, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/connect:
    get:
      operationId: connectRunner
      summary: The WebSocket a runner dials out on. Runner tokens only.
      description: |
        Upgrade to a WebSocket with the runner's credential as the bearer
        token (browsers are refused). Every text frame is one JSON object with
        a `type`: the runner sends `RunnerFrame`s and the engine `EngineFrame`s.
        Another token kind answers `403 forbidden`.

        1. The engine sends `welcome` (heartbeat every 30 s, lease of 90 s).
        2. The runner sends `hello` (version, os, cores, `maxJobs`, the leases
           it still holds).
        3. The engine sends `probe`; the runner runs the commands and answers
           `probe_result`. The engine derives the capabilities from the
           results (`ios-sign`, `android`, `flutter`, `swift-linux`) and
           ignores anything the runner claims, then sends `probed`: the
           capabilities it stored and, for each one it did not find, the
           reason and the fix. Until then the runner gets no job. It probes
           again at every connection.
        4. The engine sends `lease_offer` for a queued job that fits. The
           runner answers `lease_accept` or `lease_reject`. The lease lasts
           90 s and every `heartbeat` (every 30 s, idle runners too) renews
           the leases it lists; `heartbeat_ack` says until when. A lease that
           runs out is lost: the engine sends `cancel` when the runner comes
           back, and the job is queued again, or `waiting_for_resume` when it
           has a step with side effects, never repeated by itself (D-08,
           D-18).
        5. While the job runs the runner sends `log_chunk` (numbered from 1 per
           lease) and `step_state`. The engine stores the next chunk, ignores
           a duplicate and a chunk that skips ahead, and answers each with
           `chunk_ack` (`next` is the chunk it wants). The runner keeps
           chunks until they are acknowledged and sends again from `next`.
           `step_state` and `job_done` are idempotent.
        6. `secret_request` asks for a secret of the job (D-09, ADR 0012): only
           signing material and the Shorebird key the steps name (`secrets` of
           the offer), once per lease, answered with `secret_value` or
           `secret_denied`. Uploads never run on a runner. The offer carries
           the repository (`repository`: SSH URL and GitHub id) and the exact
           commit (`sha`) and never a credential: the runner fetches the
           commit with its own SSH key (ADR 0009).
        7. `job_done` ends the job (`lastChunk` is the last chunk sent; the
           engine ends the job once it has the log up to there) and is
           answered with `done_ack`. The artifacts are uploaded over HTTP
           before it (`PUT /runners/jobs/{id}/artifacts/{name}`).
        8. `drain` asks for no more jobs; the runner finishes its leases and
           closes. A frame the engine cannot use is answered with `fault`.

        A second connection of the same runner replaces the first (close code
        4001). The engine closes with 4003 when the runner is revoked, 4008
        when it went quiet for 90 s and 4400 on a broken protocol.
      responses:
        "101":
          description: Switching Protocols.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/bundle:
    get:
      operationId: downloadRunnerBundle
      summary: The runner bundle a runner updates itself with.
      description: |
        A runner whose version is not the engine's finishes its jobs and then
        downloads the `xp` bundle of the engine's own version for its machine
        (D-24). The body is a `.tar.gz` whose top level is `bin/xp` and `lib/`
        (what `dart build cli` makes). `Content-Length` is its size and
        `X-Content-SHA256` its SHA-256 in lowercase hexadecimal; the runner
        checks both before it switches.

        The engine reads the file from `<data-dir>/bundles/<version>/<os>-<arch>/xp.tar.gz`,
        else from `runners/<os>-<arch>/xp.tar.gz` next to its own `bin` and
        `lib`. `404` when there is none: the message says where it goes. A
        `runner` token reaches this route (ADR 0011), and so do the other
        kinds.
      parameters:
        - name: os
          in: query
          required: true
          description: The operating system the runner reports, for example `macos` or `linux`.
          schema:
            type: string
            pattern: "^[a-z0-9_]{1,32}$"
        - name: arch
          in: query
          required: true
          description: The processor architecture the runner reports, for example `arm64` or `x86_64`.
          schema:
            type: string
            pattern: "^[a-z0-9_]{1,32}$"
      responses:
        "200":
          description: The bundle.
          headers:
            Content-Length:
              schema:
                type: integer
            X-Content-SHA256:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /runners/jobs/{id}/artifacts/{name}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/ArtifactName"
    put:
      operationId: uploadRunnerArtifact
      summary: Upload a file a leased job produced. Runner tokens only.
      description: |
        The body is the file. `X-Content-SHA256` (lowercase hexadecimal) and
        `Content-Length` declare what it must be; the engine hashes the bytes
        as they arrive and stores the file only when the digest and the size
        match, so a half or wrong upload never replaces a good one. `X-Lease-Id`
        names the lease: the runner must hold it. The upload may be repeated:
        a job keeps one file per name.
      parameters:
        - name: kind
          in: query
          required: true
          description: What the file is.
          schema:
            $ref: "#/components/schemas/ArtifactKind"
        - name: X-Content-SHA256
          in: header
          required: true
          schema:
            type: string
        - name: X-Lease-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The artifact as the engine stored it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A device token created with `xpd token create`.
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: The job id, for example `job_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ArtifactId:
      name: id
      in: path
      required: true
      description: The artifact id, for example `art_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      description: The project id, for example `prj_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    WorkflowId:
      name: workflowId
      in: path
      required: true
      description: The workflow id, for example `wf_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    RunId:
      name: id
      in: path
      required: true
      description: The run id, for example `run_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ApprovalId:
      name: id
      in: path
      required: true
      description: The approval id, for example `apr_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ReleaseId:
      name: id
      in: path
      required: true
      description: The release id, for example `rel_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ReleaseStoreName:
      name: store
      in: path
      required: true
      description: The store.
      schema:
        $ref: "#/components/schemas/ReleaseStore"
    RunnerId:
      name: id
      in: path
      required: true
      description: The runner id, for example `rnr_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    ArtifactName:
      name: name
      in: path
      required: true
      description: The file name, a plain name such as `prod-1.2.0+45.aab`.
      schema:
        type: string
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: The credential id, for example `crd_1a2b3c4d5e6f7a8b`.
      schema:
        type: string
    FlavorName:
      name: flavor
      in: path
      required: true
      description: The flavor name; `default` for an app without flavors.
      schema:
        type: string
    CredentialKindPath:
      name: kind
      in: path
      required: true
      description: The kind of credential; not `github` (the engine has one GitHub token).
      schema:
        $ref: "#/components/schemas/CredentialKind"
  responses:
    CredentialInUse:
      description: |
        The credential is used by flavors, so it was not deleted; `usedBy`
        lists them. Delete with `force=true` to unassign them too.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CredentialInUseResponse"
    WorkflowInvalid:
      description: |
        The workflow document has issues, or the dispatch asks for something
        the project cannot do. The message lists them; for a document,
        `issues` has each with its line, column and hint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CredentialRejected:
      description: |
        The credential was not stored: the store or tool it is for refused it,
        or it is not usable. The message says why and what to do.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: |
        The token is valid but its kind may not do this (D-13). The message
        says what the kind may do.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AlreadyDecided:
      description: |
        The approval was decided already, or it expired. The first decision
        wins; `approval` is the approval as it stands.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AlreadyDecidedResponse"
    NotFound:
      description: |
        There is no such project, job, artifact, approval or test run, or GitHub cannot
        find the repository.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        The request clashes with what the engine holds: the repository is a
        project already, the project has releases or jobs, or the job is not
        in a state that allows the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: GitHub or git refused the call or could not be reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SecretsLocked:
      description: The engine cannot read its secrets right now (D-10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The bearer token is missing, unknown or revoked.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ResyncRequired:
      description: The event cursor is outside the resume window.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpgradeRequired:
      description: The route only speaks WebSocket.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Something went wrong in the engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - credential_in_use
        - already_decided
        - resync_required
        - credential_rejected
        - workflow_invalid
        - upgrade_required
        - internal
        - upstream_error
        - secrets_locked
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            issues:
              description: |
                For `workflow_invalid` about a document, its issues, each at
                its line and column.
              type: array
              items:
                $ref: "#/components/schemas/WorkflowIssue"
            hint:
              type: string
              description: |
                What to do about it, for the owner (UX-05). It names no
                command; a client adds its own.
            details:
              type: object
              description: |
                Facts of the error a client can act on, for example the `kind`
                of a missing credential. `reason` tells the errors a client
                answers differently apart: `archived`, `has_runs`,
                `credential_unassigned`, `production_flavor`, `ref_unknown`.
    AlreadyDecidedResponse:
      type: object
      required: [error, approval]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
        approval:
          $ref: "#/components/schemas/Approval"
    CredentialInUseResponse:
      type: object
      required: [error, usedBy]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
        usedBy:
          type: array
          description: The flavors that use the credential.
          items:
            $ref: "#/components/schemas/CredentialUsage"
    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    VersionResponse:
      type: object
      required: [version, apiVersion]
      additionalProperties: false
      properties:
        version:
          type: string
          description: The engine's own version.
        apiVersion:
          type: string
          description: Major version of this API.
    SequencedEvent:
      type: object
      required: [seq, at, type, payload]
      properties:
        seq:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        type:
          type: string
          description: |
            `engine.started`, `stream.opened`, `project.added`,
            `project.scanned`, `project.edited`, `project.removed`,
            `job.state_changed`,
            `job.step_changed`, `test_run.completed`, `credential.saved`,
            `credential.verified`, `credential.expired`, `credential.removed`,
            `credential.renamed`, `credential.assigned`,
            `credential.unassigned`, `workflow.saved`, `workflow.removed`,
            `workflow.updated`, `run.dispatched`,
            `approval.requested`, `approval.decided`, `approval.expired`,
            `project.gates_changed`, `release.created`,
            `release.state_changed`, `release.store_changed`,
            `notification.raised`, `runner.paired`, `runner.connected`,
            `runner.disconnected`, `runner.revoked`,
            `runner.capabilities_changed`, `runner.lease_lost`,
            `runner.secret_delivered`, or a type added by a
            later engine version, which a client must ignore.
        payload:
          type: object
    FindingSeverity:
      type: string
      enum: [error, warning, info]
    Finding:
      type: object
      description: |
        Something a scan noticed, with what to change to resolve it.
      required: [severity, code, message, fix]
      additionalProperties: false
      properties:
        severity:
          $ref: "#/components/schemas/FindingSeverity"
        code:
          type: string
          description: A stable snake_case identifier.
        message:
          type: string
        fix:
          type: string
        path:
          type: string
          description: The file it is about, relative to the repository root.
        app:
          type: string
          description: The path of the app it is about.
        flavor:
          type: string
    PlistVersion:
      type: object
      required: [path, literal]
      additionalProperties: false
      properties:
        path:
          type: string
        shortVersion:
          type: string
          description: CFBundleShortVersionString as written.
        buildNumber:
          type: string
          description: CFBundleVersion as written.
        literal:
          type: boolean
          description: |
            Whether either key is a literal rather than a build variable such
            as `$(FLUTTER_BUILD_NUMBER)`.
    KeystoreProfile:
      type: object
      required: [propertiesPath, propertiesPresent]
      additionalProperties: false
      properties:
        propertiesPath:
          type: string
        propertiesPresent:
          type: boolean
        storeFile:
          type: string
          description: Passwords are never read.
    ShorebirdProfile:
      type: object
      required: [flavorAppIds]
      additionalProperties: false
      properties:
        appId:
          type: string
        flavorAppIds:
          type: object
          additionalProperties:
            type: string
    FlavorProfile:
      type: object
      required:
        - name
        - implicit
        - entrypoint
        - shorebird
        - prod
        - versionFiles
        - sources
      additionalProperties: false
      properties:
        name:
          type: string
          description: |
            The flavor name; `default` for an implicit flavor, which stands
            for the only build of an app without flavors.
        implicit:
          type: boolean
        entrypoint:
          type: string
          description: Relative to the app.
        iosBundleId:
          type: string
        androidAppId:
          type: string
        iosTeam:
          type: string
        iosScheme:
          type: string
        infoPlist:
          type: string
          description: Relative to the repository root.
        shorebird:
          type: boolean
        shorebirdAppId:
          type: string
        prod:
          type: boolean
        versionFiles:
          type: array
          description: |
            The files a version bump writes, relative to the repository root.
          items:
            type: string
        sources:
          type: array
          items:
            type: string
            enum: [gradle, flavorizr, xcscheme, entrypoint]
        firebaseAppId:
          type: object
          description: |
            The Firebase app id of the flavor by platform: what the Firebase
            files of the app name, or the owner's edit. The built-in
            workflows upload to it when no input gives one.
          additionalProperties: false
          properties:
            android:
              type: string
            ios:
              type: string
        appleAppId:
          type: string
          description: |
            The App Store Connect app id of the flavor. The built-in
            workflows upload iOS builds to it when no input gives one.
    IosPackageManager:
      type: string
      enum: [cocoapods, spm, both, none]
    AppProfile:
      type: object
      required:
        - name
        - path
        - framework
        - storeCountry
        - hasIos
        - hasAndroid
        - iosPackageManager
        - flavors
        - plists
      additionalProperties: false
      properties:
        name:
          type: string
        path:
          type: string
          description: Relative to the repository root; `.` for the root.
        framework:
          type: string
          const: flutter
        version:
          type: string
        storeCountry:
          type: string
          description: Two-letter App Store storefront, lower case.
        flutterVersion:
          type: string
          description: The pin of `.fvmrc` (D-20).
        flutterVersionSource:
          type: string
        hasIos:
          type: boolean
        hasAndroid:
          type: boolean
        iosPackageManager:
          $ref: "#/components/schemas/IosPackageManager"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorProfile"
        plists:
          type: array
          items:
            $ref: "#/components/schemas/PlistVersion"
        keystore:
          $ref: "#/components/schemas/KeystoreProfile"
        shorebird:
          $ref: "#/components/schemas/ShorebirdProfile"
    BranchLayout:
      type: object
      required: [releaseBranches]
      additionalProperties: false
      properties:
        defaultBranch:
          type: string
        releaseBranches:
          type: array
          description: Existing branches that match `release/*`.
          items:
            type: string
    RepoWorkflow:
      type: object
      required: [path, provider, names]
      additionalProperties: false
      properties:
        path:
          type: string
        provider:
          type: string
          enum: [github_actions, codemagic]
        names:
          type: array
          items:
            type: string
    ProjectProfile:
      type: object
      required: [layout, apps, branches, workflows]
      additionalProperties: false
      properties:
        layout:
          type: string
          enum: [single, melos]
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppProfile"
        branches:
          $ref: "#/components/schemas/BranchLayout"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/RepoWorkflow"
    Project:
      type: object
      required:
        - id
        - githubRepoId
        - fullName
        - remote
        - defaultBaseBranch
        - profile
        - findings
      additionalProperties: false
      properties:
        id:
          type: string
        githubRepoId:
          type: integer
          description: Survives renames and transfers; keys the project (D-05).
        fullName:
          type: string
          description: "`owner/name` as GitHub spells it."
        remote:
          type: string
        localPath:
          type: string
          description: |
            The folder the project was added from. It only seeds scans.
        defaultBaseBranch:
          type: string
        profile:
          $ref: "#/components/schemas/ProjectProfile"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        scannedAt:
          type: string
          format: date-time
    ProjectsResponse:
      type: object
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    AddProjectRequest:
      type: object
      description: Exactly one of `path` and `remote`.
      additionalProperties: false
      properties:
        path:
          type: string
        remote:
          type: string
      oneOf:
        - required: [path]
        - required: [remote]
    FlavorEdit:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        prod:
          type: boolean
        shorebird:
          type: boolean
        entrypoint:
          type: string
        iosBundleId:
          type: string
        androidAppId:
          type: string
        versionFiles:
          type: array
          items:
            type: string
        firebaseAppId:
          type: object
          description: |
            The Firebase app id by platform, for example
            `1:123456789012:android:abcdef`. An empty id removes it.
          additionalProperties: false
          properties:
            android:
              type: string
              pattern: "^$|^[0-9]+:[0-9]+:android:[0-9a-f]+$"
            ios:
              type: string
              pattern: "^$|^[0-9]+:[0-9]+:ios:[0-9a-f]+$"
        appleAppId:
          type: string
          description: The App Store Connect app id. Empty removes it.
          pattern: "^[0-9]*$"
    AppEdit:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
        storeCountry:
          type: string
          pattern: "^[A-Za-z]{2}$"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorEdit"
    ProfileEdits:
      type: object
      additionalProperties: false
      properties:
        defaultBaseBranch:
          type: string
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppEdit"
    JobState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - interrupted
        - waiting_for_resume
        - waiting_for_approval
    StepState:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - skipped
        - cancelled
        - interrupted
        - waitingForApproval
    JobStep:
      type: object
      required: [ordinal, kind, state, sideEffect, attempts]
      additionalProperties: false
      properties:
        ordinal:
          type: integer
          minimum: 0
        kind:
          type: string
          description: The step type, for example `command`.
        state:
          $ref: "#/components/schemas/StepState"
        sideEffect:
          type: boolean
          description: |
            Whether the step changes something outside the engine. The engine
            never repeats such a step by itself (D-18).
        attempts:
          type: integer
          minimum: 0
        result:
          type: object
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    Job:
      type: object
      required: [id, projectId, workflowVersionId, state, createdAt, steps]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        workflowVersionId:
          type: string
        releaseId:
          type: string
        sha:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
        runnerId:
          type: string
        runId:
          type: string
          description: The run the job belongs to, if it was dispatched.
        name:
          type: string
          description: What the workflow calls the job, for example `build (android, dev)`.
        stage:
          type: integer
          minimum: 0
          description: |
            The stage of the workflow the job is in. A stage starts when every
            job of the stages before it succeeded.
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        message:
          type: string
          description: Why the job failed or was cancelled, or why it still waits.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
    Capability:
      type: string
      description: |
        What a runner can do (D-19). The engine probes them; it does not trust
        what a runner says about itself.
      enum:
        - ios-sign
        - android
        - flutter
        - swift-linux
    WorkflowVersionInfo:
      type: object
      required: [id, version, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id `Job.workflowVersionId` refers to.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    Workflow:
      type: object
      required: [id, projectId, name, builtin, version, versions, yaml]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        builtin:
          type: boolean
          description: Made by the engine; cannot be edited or deleted.
        version:
          $ref: "#/components/schemas/WorkflowVersionInfo"
        versions:
          type: array
          description: Every version, oldest first.
          items:
            $ref: "#/components/schemas/WorkflowVersionInfo"
        yaml:
          type: string
          description: The workflow document of `version`.
        inputs:
          type: array
          description: |
            The inputs `yaml` declares, as the engine reads them; empty when
            it declares none or no longer reads as a workflow.
          items:
            $ref: "#/components/schemas/WorkflowInput"
        basedOn:
          $ref: "#/components/schemas/WorkflowBasedOn"
        archivedAt:
          type: string
          format: date-time
          description: |
            When it was archived (UX-06): it keeps its runs and versions and
            is not offered to dispatch. Absent while it is not archived.
    WorkflowBasedOn:
      type: object
      required: [builtin, version]
      additionalProperties: false
      description: |
        The built-in a workflow was copied from, and the version of it the
        copy started from or last caught up with.
      properties:
        builtin:
          type: string
        version:
          type: integer
          minimum: 1
    DispatchPlan:
      type: object
      required: [flavors, platforms, stages, skipped]
      additionalProperties: false
      properties:
        flavors:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PlannedStage"
        skipped:
          type: array
          description: |
            The jobs the run leaves out (their `if` is false) and the ones the
            engine cannot plan (`blocks`), which it would refuse to dispatch.
          items:
            $ref: "#/components/schemas/SkippedJob"
        currentVersion:
          type: string
          description: The pubspec version at the commit, `x.y.z+build`.
        version:
          type: string
          description: The version the run would release.
        build:
          type: integer
          description: The build number the run would take; not taken yet.
        releaseVersion:
          type: string
    PlannedStage:
      type: object
      required: [name, jobs, gates]
      additionalProperties: false
      properties:
        name:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/PlannedJob"
        gates:
          type: array
          items:
            type: string
    PlannedJob:
      type: object
      required: [name, capabilities, engineOnly, local]
      additionalProperties: false
      properties:
        name:
          type: string
        flavor:
          type: string
        platform:
          type: string
        capabilities:
          type: array
          items:
            type: string
        engineOnly:
          type: boolean
        local:
          type: boolean
          description: Whether the engine itself can run it.
        runner:
          type: string
          description: The connected runner it would go to otherwise.
        waitReason:
          type: string
          description: Why it would wait to start.
    SkippedJob:
      type: object
      required: [name, stage, reason, blocks]
      additionalProperties: false
      properties:
        name:
          type: string
        stage:
          type: string
        flavor:
          type: string
        platform:
          type: string
        reason:
          type: string
        blocks:
          type: boolean
    InputType:
      type: string
      description: |
        What an input takes (UX-04): text, true or false, one of `options`,
        any JSON value, or a release `x.y.z+build` of the project (the
        dispatch's `releaseVersion` when it gives none).
      enum: [string, boolean, choice, json, release]
    WorkflowInput:
      type: object
      required: [name, required]
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/InputType"
        description:
          type: string
        options:
          type: array
          description: The values a `choice` input may take.
          items:
            type: string
        default:
          description: The value when a dispatch gives none.
        required:
          type: boolean
    WorkflowSummary:
      type: object
      required: [id, projectId, name, builtin, version]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        builtin:
          type: boolean
        version:
          $ref: "#/components/schemas/WorkflowVersionInfo"
        title:
          type: string
          description: The `name` the newest version gives the workflow.
        description:
          type: string
          description: What the newest version says it is for.
        basedOn:
          $ref: "#/components/schemas/WorkflowBasedOn"
        archivedAt:
          type: string
          format: date-time
          description: |
            When it was archived (UX-06): it keeps its runs and versions and
            is not offered to dispatch. Absent while it is not archived.
    WorkflowsResponse:
      type: object
      required: [workflows]
      additionalProperties: false
      properties:
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowSummary"
    CreateWorkflowRequest:
      type: object
      required: [name, yaml]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        yaml:
          type: string
        basedOn:
          $ref: "#/components/schemas/WorkflowBasedOn"
    UpdateWorkflowRequest:
      type: object
      additionalProperties: false
      description: What changes; each field only when it is given.
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
        archived:
          type: boolean
        basedOnVersion:
          type: integer
          minimum: 1
          description: |
            The version of its built-in a copy has caught up with, after a
            compare.
    WorkflowTemplate:
      type: object
      required: [id, title, description, yaml]
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        yaml:
          type: string
    WorkflowTemplatesResponse:
      type: object
      required: [templates]
      additionalProperties: false
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTemplate"
    WorkflowYamlRequest:
      type: object
      required: [yaml]
      additionalProperties: false
      properties:
        yaml:
          type: string
    WorkflowIssue:
      type: object
      required: [line, column, message]
      additionalProperties: false
      properties:
        line:
          type: integer
          minimum: 1
        column:
          type: integer
          minimum: 1
        message:
          type: string
        hint:
          type: string
          description: |
            What to write instead (`Did you mean "inputs.appIds"?`), or what
            is allowed there.
    ValidateWorkflowResponse:
      type: object
      required: [valid, issues]
      additionalProperties: false
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowIssue"
    StepKeyType:
      type: string
      enum: [string, boolean, number, list, map, any]
      description: |
        What a key of `with` holds: `list` is a list of strings, `map` a
        mapping of strings to strings.
    StepKeySchema:
      type: object
      required: [name, type, required, description]
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/StepKeyType"
        required:
          type: boolean
        default:
          description: What the step uses when it is not given.
        options:
          type: array
          description: |
            The strings it may take: one of them, or for a list, some of them.
          items:
            type: string
        description:
          type: string
    StepType:
      type: object
      required: [kind, with, title, description, group, capabilities, keys]
      additionalProperties: false
      properties:
        kind:
          type: string
        with:
          type: array
          items:
            type: string
        title:
          type: string
        description:
          type: string
        group:
          type: string
          description: Source, Checks, Build, Upload, GitHub or Other.
        capabilities:
          type: array
          description: |
            What a runner needs to run a step of this type: any one of these
            sets will do. Empty when the engine runs it.
          items:
            type: array
            items:
              type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/StepKeySchema"
    WorkflowSchema:
      type: object
      required:
        - schema
        - steps
        - gates
        - capabilities
        - matrixAxes
        - platforms
        - gateLabels
        - variables
      additionalProperties: false
      properties:
        schema:
          type: integer
          minimum: 1
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepType"
        gates:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        matrixAxes:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        gateLabels:
          type: object
          description: What each gate approves, for people.
          additionalProperties:
            type: string
        variables:
          type: array
          description: |
            The paths an expression can read, such as `flavor.prod`; `inputs`
            holds the inputs a workflow declares.
          items:
            type: string
    VersionBump:
      type: string
      enum:
        - major
        - minor
        - patch
        - keep
    DispatchRequest:
      type: object
      additionalProperties: false
      properties:
        ref:
          type: string
          description: |
            The branch, tag or commit to run on; the base branch of the project
            by default.
        app:
          type: string
          description: The path of the app (`.` for the root); needed when the project has several.
        flavors:
          type: array
          items:
            type: string
          description: |
            The flavors to run for. Workflows that lock the project take the
            production flavors by default, the others take the rest.
        platforms:
          type: array
          items:
            type: string
            enum: [android, ios]
          description: The platforms to run for; what the app has by default.
        bump:
          $ref: "#/components/schemas/VersionBump"
        version:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          description: The version to release, instead of `bump`.
        releaseVersion:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+\\+\\d+$"
          description: The release a patch applies to, `x.y.z+build`.
        release:
          type: string
          description: |
            The release (`rel_...`) the run belongs to: a new build of the
            same version after a rejection, or the merge of its pull request.
            The release endpoints set it.
        inputs:
          type: object
          description: The values of the inputs the workflow declares.
    RunState:
      type: string
      enum:
        - queued
        - running
        - waiting_for_approval
        - succeeded
        - failed
        - cancelled
    RunJob:
      type: object
      required: [id, name, stage, state]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        stage:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/JobState"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        message:
          type: string
    Run:
      type: object
      required:
        [
          id,
          projectId,
          workflowId,
          workflowVersionId,
          sha,
          state,
          locksProject,
          createdAt,
          jobs,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        workflowId:
          type: string
        workflowVersionId:
          type: string
        sha:
          type: string
          description: The commit every job starts from, in full.
        ref:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        locksProject:
          type: boolean
          description: |
            Whether the run holds the project: one production release or patch
            at a time (D-11).
        version:
          type: string
        build:
          type: integer
          description: The build number allocated at dispatch (D-11).
        createdAt:
          type: string
          format: date-time
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/RunJob"
        request:
          $ref: "#/components/schemas/DispatchRequest"
    RunsResponse:
      type: object
      required: [runs]
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next:
          type: string
          description: The `before` of the next page, when there may be one.
    ResumeJobRequest:
      type: object
      additionalProperties: false
      properties:
        fromStep:
          type: integer
          minimum: 0
          description: |
            Re-run from the step with this ordinal. Without it the job resumes
            at its first unfinished step.
    ArtifactKind:
      type: string
      enum:
        - ipa
        - aab
        - apk
        - mapping
        - dsym
        - manifest
        - shorebird_symbols
    Artifact:
      type: object
      required: [id, jobId, kind, name, size, sha256, pinned, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        jobId:
          type: string
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        name:
          type: string
          description: The file name, such as `dev-1.0.0+7.apk`.
        size:
          type: integer
          minimum: 0
          description: Bytes.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pinned:
          type: boolean
          description: A pinned artifact is kept when the engine frees up space.
        createdAt:
          type: string
          format: date-time
    ArtifactsResponse:
      type: object
      required: [artifacts]
      additionalProperties: false
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    TestStatus:
      type: string
      enum: [passed, failed, errored, skipped]
    TestRef:
      type: object
      required: [suite, name]
      additionalProperties: false
      properties:
        suite:
          type: string
          description: The test file relative to the app.
        name:
          type: string
          description: The full test name with the names of its groups.
    TestCase:
      type: object
      required: [suite, name, status]
      additionalProperties: false
      properties:
        suite:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TestStatus"
        message:
          type: string
        stackTrace:
          type: string
    TestCounts:
      type: object
      required: [total, passed, failed, errored, skipped]
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        errored:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    TestRunDiff:
      type: object
      required: [newFailures, fixed, missing, stillFailing]
      additionalProperties: false
      properties:
        comparedTo:
          type: string
          description: |
            The job of the baseline this was compared with. Absent if there was
            no baseline, so that every failure is new.
        newFailures:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        fixed:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/TestRef"
        stillFailing:
          type: integer
          minimum: 0
    TestRun:
      type: object
      required:
        [id, jobId, branch, appPath, baseline, createdAt, counts, diff]
      additionalProperties: false
      properties:
        id:
          type: string
        jobId:
          type: string
        branch:
          type: string
        appPath:
          type: string
        baseline:
          type: boolean
          description: Whether this run became the baseline of its app and branch.
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/TestCounts"
        diff:
          $ref: "#/components/schemas/TestRunDiff"
    TestRunResponse:
      type: object
      required: [run, total, offset, tests]
      additionalProperties: false
      properties:
        run:
          $ref: "#/components/schemas/TestRun"
        total:
          type: integer
          minimum: 0
          description: How many tests match the request, over all pages.
        offset:
          type: integer
          minimum: 0
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
    TestBaseline:
      type: object
      required: [appPath, branch, jobId, createdAt, counts]
      additionalProperties: false
      properties:
        appPath:
          type: string
        branch:
          type: string
        jobId:
          type: string
        createdAt:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/TestCounts"
    TestBaselinesResponse:
      type: object
      required: [baselines]
      additionalProperties: false
      properties:
        baselines:
          type: array
          items:
            $ref: "#/components/schemas/TestBaseline"
    LogLineFrame:
      type: object
      required: [type, seq, step, at, stream, text]
      additionalProperties: false
      properties:
        type:
          type: string
          const: line
        seq:
          type: integer
          minimum: 1
        step:
          type: integer
          minimum: 0
          description: The ordinal of the step that wrote the line.
        at:
          type: string
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
    LogGapFrame:
      type: object
      required: [type, fromSeq, toSeq, count]
      additionalProperties: false
      properties:
        type:
          type: string
          const: gap
        fromSeq:
          type: integer
          minimum: 1
        toSeq:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
    LogEndFrame:
      type: object
      required: [type, state]
      additionalProperties: false
      properties:
        type:
          type: string
          const: end
        state:
          $ref: "#/components/schemas/JobState"
    LogFrame:
      oneOf:
        - $ref: "#/components/schemas/LogLineFrame"
        - $ref: "#/components/schemas/LogGapFrame"
        - $ref: "#/components/schemas/LogEndFrame"
    CredentialKind:
      type: string
      enum:
        - asc_key
        - apple_id
        - play_sa
        - firebase_sa
        - keystore
        - shorebird
        - github
        - slack
    CredentialStatus:
      type: string
      description: |
        `unverified`: never checked. `verified`: accepted at the last check.
        `rejected`: refused at the last check (expired, revoked, wrong); a job
        that needs it fails preflight. `unreachable`: the last check could not
        be made, so it says nothing about the credential.
      enum: [unverified, verified, rejected, unreachable]
    GitHubTokenStatus:
      type: object
      description: |
        The GitHub token of the engine. `status`, `login`, `message` and
        `fix` are what GitHub said just now; they are absent without a token.
      required: [stored]
      properties:
        stored:
          type: boolean
        status:
          $ref: "#/components/schemas/CredentialStatus"
        login:
          type: string
          description: The GitHub login the token belongs to.
        message:
          type: string
          description: Why the token was refused or could not be checked.
        fix:
          type: string
          description: What to do about `message`.
      additionalProperties: false
    SetGitHubTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: A personal access token with the `repo` scope, or what `gh auth token` prints.
      additionalProperties: false
    Credential:
      type: object
      description: |
        The credential a flavor uses for one kind: the named credential
        assigned to it. It never carries the secret. `status`, `message` and
        `fix` combine the check of the credential (`credentialStatus`) and
        the check of the assignment (`assignmentStatus`) as preflight does.
      required: [id, projectId, app, flavor, kind, status]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id of the named credential.
        name:
          type: string
          description: The name of the named credential.
        projectId:
          type: string
        app:
          type: string
          description: The path of the app of the flavor; `.` for the root.
        flavor:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        status:
          $ref: "#/components/schemas/CredentialStatus"
        account:
          type: string
          description: |
            Who it belongs to, when that is not secret: the Apple ID, the key
            id, the service account email, the keystore alias.
        verifiedAt:
          type: string
          format: date-time
          description: When a check last accepted it.
        checkedAt:
          type: string
          format: date-time
          description: When it was last checked.
        message:
          type: string
          description: Why the last check did not accept it.
        fix:
          type: string
          description: What to do about `message`.
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"
        assignmentStatus:
          $ref: "#/components/schemas/CredentialStatus"
    CredentialsResponse:
      type: object
      required: [credentials]
      additionalProperties: false
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
    CredentialUsage:
      type: object
      description: |
        A flavor that uses a named credential, with the check of the
        assignment: can the credential reach the flavor's bundle id, package
        or app.
      required: [projectId, app, flavor, status]
      additionalProperties: false
      properties:
        projectId:
          type: string
        project:
          type: string
          description: The name of the project (`owner/repository`).
        app:
          type: string
          description: The path of the app of the flavor; `.` for the root.
        flavor:
          type: string
        status:
          $ref: "#/components/schemas/CredentialStatus"
        verifiedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
        fix:
          type: string
    NamedCredential:
      type: object
      description: |
        A credential of the engine with a name; any flavor of any project may
        use it. It never carries the secret. `status`, `message` and `fix`
        are what the last check of the credential itself found (does it
        authenticate).
      required: [id, name, kind, status, usedBy]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id, for example `crd_1a2b3c4d5e6f7a8b`. It never changes.
        name:
          type: string
          maxLength: 80
          description: Unique regardless of case.
        kind:
          $ref: "#/components/schemas/CredentialKind"
        status:
          $ref: "#/components/schemas/CredentialStatus"
        account:
          type: string
          description: |
            Who it belongs to, when that is not secret: the Apple ID, the key
            id, the service account email, the keystore alias.
        verifiedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        message:
          type: string
        fix:
          type: string
        usedBy:
          type: array
          items:
            $ref: "#/components/schemas/CredentialUsage"
    NamedCredentialsResponse:
      type: object
      required: [credentials]
      additionalProperties: false
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/NamedCredential"
    RenameCredentialRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    AssignCredentialRequest:
      type: object
      required: [credentialId]
      additionalProperties: false
      properties:
        credentialId:
          type: string
          description: The named credential the flavor uses, of the kind in the path.
        allFlavors:
          type: boolean
          description: Every flavor of the app uses it too. `false` unless given.
        replace:
          type: boolean
          description: |
            With `allFlavors`, the other flavors give up the credential of the
            kind they have. `false` unless given: they keep it.
    AssignCredentialResponse:
      type: object
      required: [assigned, kept]
      additionalProperties: false
      properties:
        assigned:
          type: array
          description: The flavors that use the credential now, with their checks.
          items:
            $ref: "#/components/schemas/Credential"
        kept:
          type: array
          description: The flavors that kept another credential of the kind.
          items:
            $ref: "#/components/schemas/Credential"
    AscKeyFields:
      type: object
      required: [keyId, issuerId, privateKey]
      properties:
        keyId:
          type: string
        issuerId:
          type: string
        privateKey:
          type: string
          description: The text of the `.p8` file.
        keyKind:
          type: string
          enum: [team, individual]
          description: "`team` unless told otherwise."
    AppleIdFields:
      type: object
      required: [appleId, password]
      properties:
        appleId:
          type: string
        password:
          type: string
          description: |
            An app-specific password (`abcd-efgh-ijkl-mnop`), not the password
            of the Apple ID.
    ServiceAccountFields:
      type: object
      required: [serviceAccount]
      properties:
        serviceAccount:
          type: string
          description: The text of the JSON key file of the service account.
    KeystoreFields:
      type: object
      required: [keystore, storePassword, keyAlias]
      properties:
        keystore:
          type: string
          description: The keystore file, base64 encoded.
        storePassword:
          type: string
        keyAlias:
          type: string
        keyPassword:
          type: string
          description: The store password unless given.
    TokenFields:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: A Shorebird API key (`sb_api_*`), or a GitHub token in the deprecated route.
    SlackFields:
      type: object
      required: [webhookUrl]
      properties:
        webhookUrl:
          type: string
    CreateCredentialRequest:
      description: |
        The name, the kind and the secret fields of that kind. `github` is not
        a named credential: use `PUT /github-token`.
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/AscKeyFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  const: asc_key
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/AppleIdFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  const: apple_id
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/ServiceAccountFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  enum: [play_sa, firebase_sa]
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/KeystoreFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  const: keystore
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/TokenFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  const: shorebird
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/SlackFields"
            - type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                kind:
                  const: slack
          unevaluatedProperties: false
    ReplaceCredentialRequest:
      description: |
        The secret fields of the credential's kind. A `kind`, if given, must
        be the credential's.
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/AscKeyFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/AppleIdFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/ServiceAccountFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/KeystoreFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/TokenFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/SlackFields"
            - $ref: "#/components/schemas/OptionalKind"
          unevaluatedProperties: false
    OptionalKind:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/CredentialKind"
    SaveCredentialRequest:
      description: |
        Deprecated with `PUT /projects/{id}/credentials`. Which flavor
        (`app`, default `.`, and `flavor`) and kind, an optional `name` for
        the credential it creates, and the secret fields of that kind.
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/AscKeyFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  const: asc_key
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/AppleIdFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  const: apple_id
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/ServiceAccountFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  enum: [play_sa, firebase_sa]
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/KeystoreFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  const: keystore
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/TokenFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  enum: [shorebird, github]
          unevaluatedProperties: false
        - allOf:
            - $ref: "#/components/schemas/SlackFields"
            - $ref: "#/components/schemas/FlavorSelector"
            - type: object
              properties:
                kind:
                  const: slack
          unevaluatedProperties: false
    FlavorSelector:
      type: object
      required: [flavor, kind]
      properties:
        app:
          type: string
        flavor:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        name:
          type: string
          maxLength: 80
    ApprovalState:
      type: string
      enum: [pending, approved, denied, expired]
      description: |
        `expired` counts as denied: nobody decided within 24 hours (D-13).
    DecidedBy:
      type: object
      required: [tokenId, name, kind]
      additionalProperties: false
      properties:
        tokenId:
          type: string
        name:
          type: string
          description: What the owner called the device or client.
        kind:
          type: string
          enum: [app, cli]
    Approval:
      type: object
      required: [id, projectId, action, sha, state, createdAt, expiresAt]
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        action:
          $ref: "#/components/schemas/GateAction"
        sha:
          type: string
          description: The commit the action happens on, in full.
        version:
          type: string
          description: The version it releases, `x.y.z+build`, if it does.
        runId:
          type: string
        jobId:
          type: string
          description: |
            The first job that asked. Other jobs of the run that reach the
            same gate share the approval.
        state:
          $ref: "#/components/schemas/ApprovalState"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 24 hours after `createdAt`.
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: "#/components/schemas/DecidedBy"
        reason:
          type: string
    GateAction:
      type: string
      enum:
        - prod_release
        - prod_patch
        - store_submission
        - push
        - merge
        - delete
    ApprovalsResponse:
      type: object
      required: [approvals]
      additionalProperties: false
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    DecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    ProjectGates:
      type: object
      required: [gates]
      additionalProperties: false
      properties:
        gates:
          type: object
          description: |
            Whether each action waits for an approval. A request lists any
            of the actions; a response lists all of them.
          propertyNames:
            $ref: "#/components/schemas/GateAction"
          additionalProperties:
            type: boolean
    ReleaseState:
      type: string
      enum:
        - draft
        - building
        - uploaded
        - in_review
        - rejected
        - approved
        - live
        - merged
        - abandoned
    ReleaseStore:
      type: string
      enum: [apple, play]
    StoreState:
      type: string
      enum: [pending, uploaded, in_review, rejected, approved, live]
    StatusSource:
      type: string
      enum: [upload, api, lookup, manual]
    StoreStatus:
      type: object
      required: [store, state, source]
      additionalProperties: false
      properties:
        store:
          $ref: "#/components/schemas/ReleaseStore"
        state:
          $ref: "#/components/schemas/StoreState"
        source:
          $ref: "#/components/schemas/StatusSource"
        detail:
          type: string
          description: |
            What the store said, as it said it, for example `IN_REVIEW` or
            `RELEASE_LIFECYCLE_STATE_PUBLISHED`.
        checkedAt:
          type: string
          format: date-time
          description: When the store was asked last.
        changedAt:
          type: string
          format: date-time
          description: When `state` last changed.
        note:
          type: string
          description: |
            Why the store could not be read the last time it was asked, or
            what the owner should know.
    ReleaseBuild:
      type: object
      required: [build, runId, createdAt]
      additionalProperties: false
      properties:
        build:
          type: integer
          minimum: 1
        runId:
          type: string
        createdAt:
          type: string
          format: date-time
    Release:
      type: object
      required:
        - id
        - projectId
        - app
        - flavor
        - version
        - build
        - state
        - stores
        - builds
        - mergeEnabled
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        projectId:
          type: string
        app:
          type: string
          description: The path of the app (`.` for the root).
        flavor:
          type: string
        version:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
        build:
          type: integer
          minimum: 1
          description: The build number now.
        state:
          $ref: "#/components/schemas/ReleaseState"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/StoreStatus"
        builds:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseBuild"
        mergeEnabled:
          type: boolean
          description: |
            Whether `POST /releases/{id}/merge` is open: every store is live,
            the release has its pull request and nothing merges it yet.
        branch:
          type: string
        baseBranch:
          type: string
        tag:
          type: string
        headSha:
          type: string
        prNumber:
          type: integer
        prUrl:
          type: string
        mergeCommit:
          type: string
        mergeRunId:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReleasesResponse:
      type: object
      required: [releases]
      additionalProperties: false
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
    StoreStatusRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [approved, live]
          description: '`approved` or `live` for Apple, `live` for Google Play.'
    AbandonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    ReleaseNoteItem:
      type: object
      required: [sha, description, breaking]
      additionalProperties: false
      properties:
        sha:
          type: string
        description:
          type: string
        scope:
          type: string
        breaking:
          type: boolean
    ReleaseNoteGroup:
      type: object
      required: [type, title, items]
      additionalProperties: false
      properties:
        type:
          type: string
          description: |
            `breaking`, `feat`, `fix`, `perf`, `refactor`, `docs` or `other`.
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseNoteItem"
    ReleaseNotes:
      type: object
      required:
        [releaseId, version, build, to, commits, groups, slack, whatsapp]
      additionalProperties: false
      properties:
        releaseId:
          type: string
        version:
          type: string
        build:
          type: integer
        from:
          type: string
          description: The tag of the release before.
        to:
          type: string
          description: The commit the notes end at.
        commits:
          type: integer
          minimum: 0
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseNoteGroup"
        compareUrl:
          type: string
        slack:
          type: string
          description: Slack `mrkdwn`.
        whatsapp:
          type: string
          description: WhatsApp text, `*bold*`, no link markup.
    StorageCategory:
      type: string
      enum: [artifacts, logs, worktrees, mirrors, flutter]
    RetentionSettings:
      type: object
      additionalProperties: false
      properties:
        keepPerFlavor:
          type: integer
          minimum: 1
          default: 5
        logDays:
          type: integer
          minimum: 1
          default: 90
    CategoryUsage:
      type: object
      required: [category, usedBytes, reclaimableBytes, items]
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/StorageCategory"
        usedBytes:
          type: integer
          minimum: 0
        reclaimableBytes:
          type: integer
          minimum: 0
        items:
          type: integer
          minimum: 0
    FlavorUsage:
      type: object
      required:
        [projectId, app, flavor, builds, artifacts, usedBytes, reclaimableBytes]
      additionalProperties: false
      properties:
        projectId:
          type: string
        app:
          type: string
        flavor:
          type: string
          description: Empty for an app without flavors.
        builds:
          type: integer
          minimum: 0
        artifacts:
          type: integer
          minimum: 0
        usedBytes:
          type: integer
          minimum: 0
        reclaimableBytes:
          type: integer
          minimum: 0
    StorageReport:
      type: object
      required: [generatedAt, categories, flavors, retention]
      additionalProperties: false
      properties:
        generatedAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryUsage"
        flavors:
          type: array
          items:
            $ref: "#/components/schemas/FlavorUsage"
        retention:
          $ref: "#/components/schemas/RetentionSettings"
    FreeSpaceRequest:
      type: object
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
          default: true
        categories:
          type: array
          items:
            $ref: "#/components/schemas/StorageCategory"
    FreedCategory:
      type: object
      required: [category, bytes, items]
      additionalProperties: false
      properties:
        category:
          $ref: "#/components/schemas/StorageCategory"
        bytes:
          type: integer
          minimum: 0
        items:
          type: integer
          minimum: 0
    FreeSpaceResult:
      type: object
      required: [dryRun, categories, failures]
      additionalProperties: false
      properties:
        dryRun:
          type: boolean
        categories:
          type: array
          items:
            $ref: "#/components/schemas/FreedCategory"
        failures:
          type: array
          items:
            type: string

    RunnerStatus:
      type: string
      enum: [offline, online, draining, revoked]
    Runner:
      type: object
      required: [id, name, status, capabilities, slots, jobIds, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/RunnerStatus"
        capabilities:
          type: array
          description: What the engine's probe found, by wire name.
          items:
            type: string
            enum: [ios-sign, android, flutter, swift-linux]
        slots:
          type: integer
          minimum: 1
        jobIds:
          type: array
          items:
            type: string
        os:
          type: string
        arch:
          type: string
        version:
          type: string
        cores:
          type: integer
          minimum: 1
        lastHeartbeat:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        missing:
          type: array
          description: >-
            What the last probe did not find, why, and what gives it. Kept in
            memory: present only while the runner is connected.
          items:
            $ref: "#/components/schemas/MissingCapability"
    MissingCapability:
      type: object
      required: [capability, reason, fix]
      additionalProperties: false
      properties:
        capability:
          type: string
          enum: [ios-sign, android, flutter, swift-linux]
        reason:
          type: string
          description: One sentence without its full stop.
        fix:
          type: string
          description: One sentence without its full stop.
    RunnersResponse:
      type: object
      required: [runners]
      additionalProperties: false
      properties:
        runners:
          type: array
          items:
            $ref: "#/components/schemas/Runner"
    CreatePairingTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: The runner's name, unique.
    PairingToken:
      type: object
      required: [token, name, expiresAt]
      additionalProperties: false
      properties:
        token:
          type: string
          description: "`xpp_` followed by 43 URL-safe characters."
        name:
          type: string
        expiresAt:
          type: string
          format: date-time
        engineUrl:
          type: string
          description: >-
            The runner URL the owner set (`/settings/runner-url`), for the
            `xp runner pair --engine` command. Absent when none is set.
    RunnerUrl:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          description: The absolute http or https URL. Absent when none is set.
        warning:
          type: string
          description: >-
            Why the URL may be a bad idea though it was accepted, for example
            a plain http URL that leaves this machine and the tailnet.
    SetRunnerUrlRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: [string, "null"]
          description: The runner URL, or null to clear it.
    PairRunnerRequest:
      type: object
      required: [pairingToken]
      additionalProperties: false
      properties:
        pairingToken:
          type: string
    PairRunnerResponse:
      type: object
      required: [runner, token]
      additionalProperties: false
      properties:
        runner:
          $ref: "#/components/schemas/Runner"
        token:
          type: string
          description: The runner's credential, a device token of kind `runner`.
    LeaseRef:
      type: object
      required: [jobId, leaseId]
      additionalProperties: false
      properties:
        jobId:
          type: string
        leaseId:
          type: string
    LeaseGrant:
      type: object
      required: [jobId, leaseId, until]
      additionalProperties: false
      properties:
        jobId:
          type: string
        leaseId:
          type: string
        until:
          type: string
          format: date-time
    LeaseStep:
      type: object
      required: [ordinal, kind, sideEffect, state, attempts, input]
      additionalProperties: false
      properties:
        ordinal:
          type: integer
          minimum: 0
        kind:
          type: string
        sideEffect:
          type: boolean
        state:
          $ref: "#/components/schemas/StepState"
        attempts:
          type: integer
          minimum: 0
        input:
          type: object
    ProbeCommand:
      type: object
      required: [id, executable, arguments, timeoutSeconds]
      additionalProperties: false
      properties:
        id:
          type: string
        executable:
          type: string
        arguments:
          type: array
          items:
            type: string
        timeoutSeconds:
          type: integer
          minimum: 1
        requires:
          type: string
          description: The id of a command that must have exited with 0.
        onlyOn:
          type: string
          enum: [macos, linux]
    ProbeResult:
      type: object
      required: [id, status, stdout, stderr]
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [exited, skipped, not_started, timed_out]
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
    ChunkLine:
      type: object
      required: [step, at, stream, text]
      additionalProperties: false
      properties:
        step:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
    HelloFrame:
      type: object
      required: [type, version, os, arch, cores, draining, leases]
      additionalProperties: false
      properties:
        type:
          const: hello
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        cores:
          type: integer
          minimum: 1
        maxJobs:
          type: integer
          minimum: 1
        draining:
          type: boolean
        leases:
          type: array
          items:
            $ref: "#/components/schemas/LeaseRef"
    ProbeResultFrame:
      type: object
      required: [type, probeId, results]
      additionalProperties: false
      properties:
        type:
          const: probe_result
        probeId:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProbeResult"
    LeaseAcceptFrame:
      type: object
      required: [type, jobId, leaseId]
      additionalProperties: false
      properties:
        type:
          const: lease_accept
        jobId:
          type: string
        leaseId:
          type: string
    LeaseRejectFrame:
      type: object
      required: [type, jobId, leaseId, reason]
      additionalProperties: false
      properties:
        type:
          const: lease_reject
        jobId:
          type: string
        leaseId:
          type: string
        reason:
          type: string
    HeartbeatFrame:
      type: object
      required: [type, leases]
      additionalProperties: false
      properties:
        type:
          const: heartbeat
        leases:
          type: array
          items:
            $ref: "#/components/schemas/LeaseRef"
    LogChunkFrame:
      type: object
      required: [type, jobId, leaseId, seq, lines]
      additionalProperties: false
      properties:
        type:
          const: log_chunk
        jobId:
          type: string
        leaseId:
          type: string
        seq:
          type: integer
          minimum: 1
        lines:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ChunkLine"
    StepStateFrame:
      type: object
      required: [type, jobId, leaseId, ordinal, state, attempts]
      additionalProperties: false
      properties:
        type:
          const: step_state
        jobId:
          type: string
        leaseId:
          type: string
        ordinal:
          type: integer
          minimum: 0
        state:
          $ref: "#/components/schemas/StepState"
        attempts:
          type: integer
          minimum: 0
        result:
          type: object
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobDoneFrame:
      type: object
      required: [type, jobId, leaseId, state, lastChunk]
      additionalProperties: false
      properties:
        type:
          const: job_done
        jobId:
          type: string
        leaseId:
          type: string
        state:
          type: string
          enum: [succeeded, failed, cancelled]
        lastChunk:
          type: integer
          minimum: 0
        message:
          type: string
    SecretRequestFrame:
      type: object
      required: [type, jobId, leaseId, key]
      additionalProperties: false
      properties:
        type:
          const: secret_request
        jobId:
          type: string
        leaseId:
          type: string
        key:
          type: string
    DrainFrame:
      type: object
      required: [type, draining]
      additionalProperties: false
      properties:
        type:
          const: drain
        draining:
          type: boolean
    RunnerFrame:
      description: |
        A frame the runner sends. A type this engine does not know is
        answered with a `fault` frame.
      oneOf:
        - $ref: "#/components/schemas/HelloFrame"
        - $ref: "#/components/schemas/ProbeResultFrame"
        - $ref: "#/components/schemas/LeaseAcceptFrame"
        - $ref: "#/components/schemas/LeaseRejectFrame"
        - $ref: "#/components/schemas/HeartbeatFrame"
        - $ref: "#/components/schemas/LogChunkFrame"
        - $ref: "#/components/schemas/StepStateFrame"
        - $ref: "#/components/schemas/JobDoneFrame"
        - $ref: "#/components/schemas/SecretRequestFrame"
        - $ref: "#/components/schemas/DrainFrame"
    WelcomeFrame:
      type: object
      required:
        [type, runnerId, engineVersion, apiVersion, heartbeatSeconds, leaseSeconds]
      additionalProperties: false
      properties:
        type:
          const: welcome
        runnerId:
          type: string
        engineVersion:
          type: string
        apiVersion:
          type: string
        heartbeatSeconds:
          type: integer
          minimum: 1
        leaseSeconds:
          type: integer
          minimum: 1
    ProbeFrame:
      type: object
      required: [type, probeId, commands]
      additionalProperties: false
      properties:
        type:
          const: probe
        probeId:
          type: string
        commands:
          type: array
          items:
            $ref: "#/components/schemas/ProbeCommand"
    ProbedFrame:
      type: object
      required: [type, capabilities, missing]
      additionalProperties: false
      properties:
        type:
          const: probed
        capabilities:
          type: array
          items:
            type: string
            enum: [ios-sign, android, flutter, swift-linux]
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingCapability"
    LeaseRepository:
      type: object
      description: >-
        Where a runner gets the commit of a leased job: the repository's SSH
        URL and GitHub id. Never a credential; the runner reaches GitHub with
        its own SSH key (ADR 0009).
      required: [githubRepoId, sshUrl]
      additionalProperties: false
      properties:
        githubRepoId:
          type: integer
        sshUrl:
          type: string
    LeaseOfferFrame:
      type: object
      required:
        [type, leaseId, jobId, projectId, stage, capabilities, expiresAt, steps, secrets]
      additionalProperties: false
      properties:
        type:
          const: lease_offer
        leaseId:
          type: string
        jobId:
          type: string
        projectId:
          type: string
        sha:
          type: string
          description: >-
            The exact commit the job builds, in full. The runner checks it out
            and verifies its head before it runs a step (ADR 0009).
        name:
          type: string
        repository:
          $ref: "#/components/schemas/LeaseRepository"
        stage:
          type: integer
          minimum: 0
        capabilities:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/LeaseStep"
        secrets:
          type: array
          description: >-
            Keys only; the values come with `secret_value`. Signing material
            and the Shorebird key that the steps of the job name (D-09, ADR
            0012).
          items:
            type: string
    HeartbeatAckFrame:
      type: object
      required: [type, leases]
      additionalProperties: false
      properties:
        type:
          const: heartbeat_ack
        leases:
          type: array
          items:
            $ref: "#/components/schemas/LeaseGrant"
    ChunkAckFrame:
      type: object
      required: [type, jobId, leaseId, seq, next, status]
      additionalProperties: false
      properties:
        type:
          const: chunk_ack
        jobId:
          type: string
        leaseId:
          type: string
        seq:
          type: integer
        next:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [stored, duplicate, gap]
    DoneAckFrame:
      type: object
      required: [type, jobId, leaseId, state]
      additionalProperties: false
      properties:
        type:
          const: done_ack
        jobId:
          type: string
        leaseId:
          type: string
        state:
          $ref: "#/components/schemas/JobState"
    CancelFrame:
      type: object
      required: [type, jobId, reason]
      additionalProperties: false
      properties:
        type:
          const: cancel
        jobId:
          type: string
        leaseId:
          type: string
        reason:
          type: string
    SecretValueFrame:
      type: object
      required: [type, jobId, leaseId, key, value]
      additionalProperties: false
      properties:
        type:
          const: secret_value
        jobId:
          type: string
        leaseId:
          type: string
        key:
          type: string
        value:
          type: string
    SecretDeniedFrame:
      type: object
      required: [type, jobId, leaseId, key, reason]
      additionalProperties: false
      properties:
        type:
          const: secret_denied
        jobId:
          type: string
        leaseId:
          type: string
        key:
          type: string
        reason:
          type: string
    FaultFrame:
      type: object
      required: [type, code, message]
      additionalProperties: false
      properties:
        type:
          const: fault
        code:
          type: string
        message:
          type: string
    EngineFrame:
      description: |
        A frame the engine sends. A runner ignores a type it does not know.
      oneOf:
        - $ref: "#/components/schemas/WelcomeFrame"
        - $ref: "#/components/schemas/ProbeFrame"
        - $ref: "#/components/schemas/ProbedFrame"
        - $ref: "#/components/schemas/LeaseOfferFrame"
        - $ref: "#/components/schemas/HeartbeatAckFrame"
        - $ref: "#/components/schemas/ChunkAckFrame"
        - $ref: "#/components/schemas/DoneAckFrame"
        - $ref: "#/components/schemas/CancelFrame"
        - $ref: "#/components/schemas/SecretValueFrame"
        - $ref: "#/components/schemas/SecretDeniedFrame"
        - $ref: "#/components/schemas/FaultFrame"
